trigger:
  branches:
    include:
      - main
      - feat/*

pool:
  name: 'ec2-agents'

variables:
  - group: nautobot-azure-secrets

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: Validate
        displayName: 'Validate Code'
        steps:
          - bash: |
              set -e
              echo "Using Python 3.11"
              python3.11 --version
              echo "Installing dependencies..."
              python3.11 -m pip install --user ansible ansible-lint yamllint
            displayName: 'Install Dependencies'

          - bash: |
              set -e
              echo "Linting Ansible playbooks..."
              ansible-lint playbooks/*.yml || true
            displayName: 'Lint Ansible Playbooks'

          - bash: |
              set -e
              echo "Validating playbook syntax..."
              
              # Check if VAULT_PASSWORD is set
              if [ -z "$VAULT_PASSWORD" ]; then
                echo "ERROR: VAULT_PASSWORD variable not set in variable group!"
                echo "Please add VAULT_PASSWORD to the 'nautobot-azure-secrets' variable group"
                exit 1
              fi
              
              # Write vault password from pipeline variable (trim whitespace)
              echo "$VAULT_PASSWORD" | tr -d '[:space:]' > /tmp/vault_pass.txt
              echo "HCLtech@2025" >> /tmp/vault_pass.txt  # Fallback for testing
              
              # Test vault decryption
              if ! ansible-vault view group_vars/dev/vault.yml --vault-password-file /tmp/vault_pass.txt > /dev/null 2>&1; then
                echo "WARNING: Vault password incorrect, using local password"
                echo "HCLtech@2025" > /tmp/vault_pass.txt
              fi
              
              ansible-playbook --syntax-check playbooks/deploy_app_only.yml \
                -e "deploy_env=dev" \
                --vault-password-file /tmp/vault_pass.txt || echo "Warning: deploy_app_only syntax check skipped"
              
              ansible-playbook --syntax-check playbooks/deploy_vm_all.yml \
                -e "deploy_env=dev" \
                --vault-password-file /tmp/vault_pass.txt
              
              rm -f /tmp/vault_pass.txt
            displayName: 'Syntax Check Playbooks'
            env:
              VAULT_PASSWORD: $(VAULT_PASSWORD)

          - bash: |
              set -e
              echo "Validating YAML files..."
              yamllint -c .yamllint group_vars/ inventory/ || true
            displayName: 'Validate YAML Files'

      - job: Package
        displayName: 'Package Application'
        dependsOn: Validate
        steps:
          - bash: |
              set -e
              echo "Creating deployment package..."
              mkdir -p $(Build.ArtifactStagingDirectory)/nautobot-deploy
              
              # Copy Ansible files
              cp -r playbooks $(Build.ArtifactStagingDirectory)/nautobot-deploy/
              cp -r roles $(Build.ArtifactStagingDirectory)/nautobot-deploy/
              cp -r group_vars $(Build.ArtifactStagingDirectory)/nautobot-deploy/
              cp -r inventory $(Build.ArtifactStagingDirectory)/nautobot-deploy/
              cp -r files $(Build.ArtifactStagingDirectory)/nautobot-deploy/
              cp ansible.cfg $(Build.ArtifactStagingDirectory)/nautobot-deploy/
              
              echo "Package created successfully"
              ls -la $(Build.ArtifactStagingDirectory)/nautobot-deploy/
            displayName: 'Create Deployment Package'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/nautobot-deploy'
              ArtifactName: 'nautobot-package'

  - stage: Deploy_Web
    displayName: 'Deploy Web Servers'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployWeb
        displayName: 'Deploy to Web VMSS'
        steps:
          - download: current
            artifact: nautobot-package
            displayName: 'Download Package'

          - bash: |
              set -e
              echo "Installing Ansible and Azure CLI..."
              python3.11 -m pip install --user ansible azure-cli
            displayName: 'Install Ansible'

          - bash: |
              set -e
              
              # Login to Azure
              az login --service-principal \
                -u $(ARM_CLIENT_ID) \
                -p $(ARM_CLIENT_SECRET) \
                --tenant $(ARM_TENANT_ID)
              az account set --subscription $(ARM_SUBSCRIPTION_ID)
              
              # Get Web VMSS IPs
              echo "Getting Web VM count and load balancer IP..."
              WEB_COUNT=$(az vmss list-instances -g dev-nautobot-rg -n vmss-nautobot-web-dev --query "length(@)" -o tsv)
              LB_IP=$(az network public-ip show -g dev-nautobot-rg -n pip-lb-nautobot-dev --query "ipAddress" -o tsv)
              
              echo "Web VMs: $WEB_COUNT, Load Balancer IP: $LB_IP"
              
              # Create inventory for web servers using load balancer IP
              cd $(Pipeline.Workspace)/nautobot-package
              mkdir -p inventory/dynamic
              
              # Write inventory file with echo - use LB IP with SSH NAT port
              echo "all:" > inventory/dynamic/web.yml
              echo "  children:" >> inventory/dynamic/web.yml
              echo "    web_servers:" >> inventory/dynamic/web.yml
              echo "      hosts:" >> inventory/dynamic/web.yml
              echo "        $LB_IP:" >> inventory/dynamic/web.yml
              echo "      vars:" >> inventory/dynamic/web.yml
              echo "        ansible_user: azureuser" >> inventory/dynamic/web.yml
              echo "        ansible_port: 2201" >> inventory/dynamic/web.yml
              
              echo "Web inventory created:"
              cat inventory/dynamic/web.yml
            displayName: 'Create Web Inventory'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)

          - bash: |
              set -e
              cd $(Pipeline.Workspace)/nautobot-package
              
              # Setup SSH key
              mkdir -p ~/.ssh
              echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
              chmod 600 ~/.ssh/id_rsa
              
              # Write vault password
              echo "$VAULT_PASSWORD" > vault_pass.txt
              
              # Deploy to web servers (only app role, skip postgres/redis)
              echo "Deploying Nautobot to web servers..."
              ansible-playbook -i inventory/dynamic/web.yml \
                playbooks/deploy_vm_all.yml \
                --vault-password-file vault_pass.txt \
                --tags "app" \
                -e "deploy_env=dev" \
                -e "postgresql_host=dev-nautobot-psql.postgres.database.azure.com" \
                -e "redis_host=dev-nautobot-redis.redis.cache.windows.net" \
                -e "redis_port=6380" \
                -e "use_managed_services=true" \
                -v
              
              # Cleanup
              rm -f ~/.ssh/id_rsa vault_pass.txt
              
              echo "✅ Web servers deployment complete!"
            displayName: 'Deploy Nautobot to Web'
            env:
              SSH_PRIVATE_KEY: $(SSH_PRIVATE_KEY)
              VAULT_PASSWORD: $(VAULT_PASSWORD)
              ANSIBLE_HOST_KEY_CHECKING: 'False'

  - stage: Deploy_Worker
    displayName: 'Deploy Worker Servers'
    dependsOn: Deploy_Web
    condition: succeeded()
    jobs:
      - job: DeployWorker
        displayName: 'Deploy to Worker VMSS'
        steps:
          - download: current
            artifact: nautobot-package
            displayName: 'Download Package'

          - bash: |
              set -e
              echo "Installing Ansible and Azure CLI..."
              python3.11 -m pip install --user ansible azure-cli
            displayName: 'Install Ansible'

          - bash: |
              set -e
              
              # Login to Azure
              az login --service-principal \
                -u $(ARM_CLIENT_ID) \
                -p $(ARM_CLIENT_SECRET) \
                --tenant $(ARM_TENANT_ID)
              az account set --subscription $(ARM_SUBSCRIPTION_ID)
              
              # Get Worker VMSS IPs
              echo "Getting Worker VM count and load balancer IP..."
              WORKER_COUNT=$(az vmss list-instances -g dev-nautobot-rg -n vmss-nautobot-worker-dev --query "length(@)" -o tsv)
              LB_IP=$(az network public-ip show -g dev-nautobot-rg -n pip-lb-nautobot-dev --query "ipAddress" -o tsv)
              
              echo "Worker VMs: $WORKER_COUNT, Load Balancer IP: $LB_IP"
              
              # Create inventory for worker servers using load balancer IP
              cd $(Pipeline.Workspace)/nautobot-package
              mkdir -p inventory/dynamic
              
              # Write inventory file with echo - use LB IP with SSH NAT port
              echo "all:" > inventory/dynamic/worker.yml
              echo "  children:" >> inventory/dynamic/worker.yml
              echo "    worker_servers:" >> inventory/dynamic/worker.yml
              echo "      hosts:" >> inventory/dynamic/worker.yml
              echo "        $LB_IP:" >> inventory/dynamic/worker.yml
              echo "      vars:" >> inventory/dynamic/worker.yml
              echo "        ansible_user: azureuser" >> inventory/dynamic/worker.yml
              echo "        ansible_port: 2202" >> inventory/dynamic/worker.yml
              
              echo "Worker inventory created:"
              cat inventory/dynamic/worker.yml
            displayName: 'Create Worker Inventory'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)

          - bash: |
              set -e
              cd $(Pipeline.Workspace)/nautobot-package
              
              # Setup SSH key
              mkdir -p ~/.ssh
              echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
              chmod 600 ~/.ssh/id_rsa
              
              # Write vault password
              echo "$VAULT_PASSWORD" > vault_pass.txt
              
              # Deploy to worker servers (only worker role, skip postgres/redis)
              echo "Deploying Nautobot to worker servers..."
              ansible-playbook -i inventory/dynamic/worker.yml \
                playbooks/deploy_vm_all.yml \
                --vault-password-file vault_pass.txt \
                --tags "worker" \
                -e "deploy_env=dev" \
                -e "postgresql_host=dev-nautobot-psql.postgres.database.azure.com" \
                -e "redis_host=dev-nautobot-redis.redis.cache.windows.net" \
                -e "redis_port=6380" \
                -e "use_managed_services=true" \
                -v
              
              # Cleanup
              rm -f ~/.ssh/id_rsa vault_pass.txt
              
              echo "✅ Worker servers deployment complete!"
            displayName: 'Deploy Nautobot to Worker'
            env:
              SSH_PRIVATE_KEY: $(SSH_PRIVATE_KEY)
              VAULT_PASSWORD: $(VAULT_PASSWORD)
              ANSIBLE_HOST_KEY_CHECKING: 'False'
