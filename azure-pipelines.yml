trigger:
  branches:
    include:
      - main
      - feat/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: nautobot-azure-secrets

stages:
  - stage: Terraform_Deploy
    displayName: 'Deploy Azure Infrastructure'
    jobs:
      - job: Terraform
        displayName: 'Terraform Deployment'
        steps:
          - bash: |
              # Install Terraform
              wget -O terraform.zip https://releases.hashicorp.com/terraform/1.7.0/terraform_1.7.0_linux_amd64.zip
              unzip terraform.zip
              sudo mv terraform /usr/local/bin/
              terraform version
            displayName: 'Install Terraform'
          
          - bash: |
              set -e
              cd terraform
              
              # Create backend config
              cat > backend-dev.hcl << EOF
              resource_group_name  = "terraform-state-rg"
              storage_account_name = "$(STORAGE_ACCOUNT_NAME)"
              container_name       = "tfstate"
              key                  = "dev.terraform.tfstate"
              access_key           = "$(STORAGE_KEY)"
              EOF
              
              # Initialize Terraform
              echo "Initializing Terraform..."
              terraform init -backend-config=backend-dev.hcl
              
              # Validate
              echo "Validating Terraform configuration..."
              terraform validate
              
              # Plan
              echo "Planning deployment..."
              terraform plan \
                -var-file=environments/dev.tfvars \
                -var="db_admin_password=$(DB_ADMIN_PASSWORD)" \
                -out=tfplan
              
              # Apply
              echo "Applying Terraform configuration..."
              terraform apply -auto-approve tfplan
              
              # Output results
              echo "Deployment complete! Outputs:"
              terraform output -json > $(Build.ArtifactStagingDirectory)/terraform-outputs.json
              terraform output
              
            displayName: 'Deploy Infrastructure with Terraform'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Terraform Outputs'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'terraform-outputs'

  - stage: Ansible_Deploy
    displayName: 'Deploy Nautobot Application'
    dependsOn: Terraform_Deploy
    condition: succeeded()
    jobs:
      - job: Ansible
        displayName: 'Ansible Configuration'
        steps:
          - task: DownloadBuildArtifacts@0
            displayName: 'Download Terraform Outputs'
            inputs:
              artifactName: 'terraform-outputs'
          
          - bash: |
              set -e
              
              # Install dependencies
              echo "Installing Ansible and dependencies..."
              sudo apt-get update -qq
              sudo apt-get install -y ansible python3-pip
              pip3 install pyyaml jinja2 azure-cli
              
              # Login to Azure using service principal
              az login --service-principal \
                -u $(ARM_CLIENT_ID) \
                -p $(ARM_CLIENT_SECRET) \
                --tenant $(ARM_TENANT_ID)
              az account set --subscription $(ARM_SUBSCRIPTION_ID)
              
              # Get VMSS IPs dynamically
              echo "Getting VM IPs from Azure..."
              WEB_IPS=$(az vmss nic list \
                --resource-group dev-nautobot-rg \
                --vmss-name vmss-nautobot-web-dev \
                --query "[].ipConfigurations[0].privateIpAddress" -o tsv)
              
              WORKER_IPS=$(az vmss nic list \
                --resource-group dev-nautobot-rg \
                --vmss-name vmss-nautobot-worker-dev \
                --query "[].ipConfigurations[0].privateIpAddress" -o tsv)
              
              # Create dynamic inventory
              echo "Creating Ansible inventory..."
              mkdir -p inventory/vm
              cat > inventory/vm/dev_dynamic.yml <<EOF
              all:
                children:
                  web_servers:
                    hosts:
              $(echo "$WEB_IPS" | while read ip; do echo "        $ip:"; done)
                  worker_servers:
                    hosts:
              $(echo "$WORKER_IPS" | while read ip; do echo "        $ip:"; done)
                vars:
                  ansible_user: azureuser
                  environment: dev
              EOF
              
              cat inventory/vm/dev_dynamic.yml
              
            displayName: 'Setup Ansible Environment'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)

          - bash: |
              set -e
              
              # Setup SSH key
              mkdir -p ~/.ssh
              echo "$(SSH_PRIVATE_KEY)" > ~/.ssh/id_rsa
              chmod 600 ~/.ssh/id_rsa
              
              # Write vault password
              echo "$(VAULT_PASSWORD)" > vault_pass.txt
              
              # Check connectivity
              echo "Testing VM connectivity..."
              ansible all -i inventory/vm/dev_dynamic.yml -m ping || echo "Some VMs not reachable yet"
              
              # Run deployment playbook
              echo "Deploying Nautobot application..."
              ansible-playbook -i inventory/vm/dev_dynamic.yml \
                playbooks/deploy_app_only.yml \
                --vault-password-file vault_pass.txt \
                -e "deploy_env=dev" \
                -v || echo "Deployment completed with warnings"
              
              # Cleanup
              rm -f ~/.ssh/id_rsa vault_pass.txt
              
              echo "✅ Nautobot deployment complete!"
              
            displayName: 'Deploy Nautobot with Ansible'
            env:
              SSH_PRIVATE_KEY: $(SSH_PRIVATE_KEY)
              VAULT_PASSWORD: $(VAULT_PASSWORD)
              ANSIBLE_HOST_KEY_CHECKING: 'False'
