# Source: nautobot/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: nautobot-config
  namespace: nautobot
  labels:
    helm.sh/chart: nautobot-1.0.0
    app.kubernetes.io/name: nautobot
    app.kubernetes.io/instance: nautobot
    app.kubernetes.io/version: "3.0.6"
    app.kubernetes.io/managed-by: Helm
data:
  nautobot_config.py: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: nautobot-config
      namespace: nautobot
      labels:
    helm.sh/chart: nautobot-1.0.0
    app.kubernetes.io/name: nautobot
    app.kubernetes.io/instance: nautobot
    app.kubernetes.io/version: "3.0.6"
    app.kubernetes.io/managed-by: Helm
    data:
      nautobot_config.py: |
        import os
        from nautobot.core.settings import *
        from nautobot.core.settings_funcs import is_truthy, parse_redis_connection
        # Basic Configuration
        ALLOWED_HOSTS = ["*"]
        DEBUG = False
        # Database Configuration
        DATABASES = {
            "default": {
                "NAME": os.getenv("NAUTOBOT_DB_NAME", "nautobot"),
                "USER": os.getenv("NAUTOBOT_DB_USER", "nautobot"),
                "PASSWORD": os.getenv("NAUTOBOT_DB_PASSWORD", ""),
                "HOST": os.getenv("NAUTOBOT_DB_HOST", "nautobot-postgresql.nautobot.svc.cluster.local"),
                "PORT": os.getenv("NAUTOBOT_DB_PORT", "5432"),
                "ENGINE": "django.db.backends.postgresql",
                "CONN_MAX_AGE": 300,
                "OPTIONS": {"sslmode": "prefer"},
            }
        }
        # Redis Configuration
        REDIS_HOST = "nautobot-redis.nautobot.svc.cluster.local"
        REDIS_PORT = 6379
        REDIS_PASSWORD = os.getenv("NAUTOBOT_REDIS_PASSWORD", "")
        CACHES = {
            "default": {
                "BACKEND": "django_redis.cache.RedisCache",
                "LOCATION": f"redis://{REDIS_HOST}:{REDIS_PORT}/0",
                "OPTIONS": {
                    "CLIENT_CLASS": "django_redis.client.DefaultClient",
                    "PASSWORD": os.getenv("NAUTOBOT_REDIS_PASSWORD", ""),
                },
            }
        }
        # Celery Configuration
        CELERY_BROKER_URL = f"redis://:{REDIS_PASSWORD}@{REDIS_HOST}:{REDIS_PORT}/0"
        CELERY_RESULT_BACKEND = f"redis://:{REDIS_PASSWORD}@{REDIS_HOST}:{REDIS_PORT}/1"
        # Secret Key
        SECRET_KEY = os.getenv("NAUTOBOT_SECRET_KEY", "")
        # Storage Configuration
        MEDIA_ROOT = "/opt/nautobot/media"
        STATIC_ROOT = "/opt/nautobot/static"
        GIT_ROOT = "/opt/nautobot/git"
        # Logging
        LOG_LEVEL = "INFO"
        LOGGING = {
            "version": 1,
            "disable_existing_loggers": False,
            "formatters": {
                "normal": {
                    "format": "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
                },
                "verbose": {
                    "format": "%(asctime)s [%(levelname)s] %(name)s (%(module)s:%(funcName)s:%(lineno)d): %(message)s"
                },
            },
            "handlers": {
                "console": {
                    "level": LOG_LEVEL,
                    "class": "logging.StreamHandler",
                    "formatter": "normal",
                },
            },
            "root": {
                "handlers": ["console"],
                "level": LOG_LEVEL,
            },
        }
        # Metrics
        METRICS_ENABLED = True
        # Plugins - Will be configured dynamically after runtime installation
        # Do not set PLUGINS here as they're installed at container startup
        # Session and CSRF
        SESSION_COOKIE_SECURE = False  # Set to True if using HTTPS
        CSRF_COOKIE_SECURE = False  # Set to True if using HTTPS
        # Time zone
        TIME_ZONE = "UTC"
        PLUGINS_CONFIG = {}
