apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nautobot-worker
  namespace: nautobot
  labels:
    helm.sh/chart: nautobot-1.0.0
    app.kubernetes.io/name: nautobot
    app.kubernetes.io/instance: nautobot
    app.kubernetes.io/version: "3.0.6"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nautobot-worker
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
