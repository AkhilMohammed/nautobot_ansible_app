apiVersion: apps/v1
kind: Deployment
metadata:
  name: nautobot-scheduler
  namespace: nautobot
  labels:
    helm.sh/chart: nautobot-1.0.0
    app.kubernetes.io/name: nautobot
    app.kubernetes.io/instance: nautobot
    app.kubernetes.io/version: "3.0.6"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nautobot
      app.kubernetes.io/instance: nautobot
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nautobot
        app.kubernetes.io/instance: nautobot
        app.kubernetes.io/component: scheduler
      annotations:
        checksum/config: fdcdf77a3ae034d824a1a5d9e3bf9fd714d27e01bf30b70a0ca6c57e3698f20c
    spec:
      serviceAccountName: nautobot
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: nautobot-scheduler
          image: "networktocode/nautobot:3.0.6-py3.11"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              echo "==> Installing Git plugins at runtime..."
              if ! command -v git >/dev/null 2>&1; then
                echo "Installing git..."
                pkill -9 apt apt-get dpkg || true
                rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock
                dpkg --configure -a
                while lsof /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock >/dev/null 2>&1; do echo "Waiting for apt/dpkg lock..."; sleep 2; done
                apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1 || true
              fi
              echo "Installing: nautobot-device-lifecycle-mgmt"
              pip install --no-cache-dir nautobot-device-lifecycle-mgmt || (echo "ERROR: Failed to install nautobot-device-lifecycle-mgmt" && exit 1)
              echo "Installing: nautobot-bgp-models"
              pip install --no-cache-dir nautobot-bgp-models || (echo "ERROR: Failed to install nautobot-bgp-models" && exit 1)
              echo "Installing: nautobot-dns-manager"
              pip install --no-cache-dir nautobot-dns-manager || (echo "ERROR: Failed to install nautobot-dns-manager" && exit 1)
              echo "==> ✓ All plugins installed successfully!"
              
              echo "==> Configuring plugins (creating writable copy)..."
              cp /opt/nautobot/nautobot_config.py /tmp/nautobot_config.py
              cat >> /tmp/nautobot_config.py << 'PLUGIN_EOF'
              
              # Plugins - Dynamically configured after runtime installation
              PLUGINS = [
                  "nautobot_device_lifecycle_mgmt",
                  "nautobot_bgp_models",
                  "nautobot_dns_manager",
              ]
              
              PLUGINS_CONFIG = {"nautobot_bgp_models":{},"nautobot_device_lifecycle_mgmt":{},"nautobot_dns_manager":{}}
              PLUGIN_EOF
              
              export NAUTOBOT_CONFIG=/tmp/nautobot_config.py
              echo "==> ✓ Plugins configured!"
              echo "==> Starting Celery beat..."
              exec nautobot-server celery beat -l INFO
          env:
            - name: NAUTOBOT_DB_NAME
              value: "nautobot"
            - name: NAUTOBOT_DB_USER
              valueFrom:
                secretKeyRef:
                  name: nautobot-secrets
                  key: db-user
            - name: NAUTOBOT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nautobot-secrets
                  key: db-password
            - name: NAUTOBOT_DB_HOST
              value: nautobot-postgresql.nautobot.svc.cluster.local
            - name: NAUTOBOT_DB_PORT
              value: "5432"
            - name: NAUTOBOT_REDIS_HOST
              value: nautobot-redis.nautobot.svc.cluster.local
            - name: NAUTOBOT_REDIS_PORT
              value: "6379"
            - name: NAUTOBOT_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nautobot-secrets
                  key: redis-password
            - name: NAUTOBOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nautobot-secrets
                  key: secret-key
            - name: NAUTOBOT_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nautobot-secrets
                  key: superuser-password
            - name: NAUTOBOT_CREATE_SUPERUSER
              value: "true"
            - name: NAUTOBOT_SUPERUSER_NAME
              value: "admin"
            - name: NAUTOBOT_SUPERUSER_EMAIL
              value: "admin@example.com"
            
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /opt/nautobot/nautobot_config.py
              subPath: nautobot_config.py
            - name: media
              mountPath: /opt/nautobot/media
          securityContext:
            capabilities:
              drop:
              - ALL
            runAsNonRoot: true
            runAsUser: 999
      volumes:
        - name: plugins
          emptyDir: {}
        - name: config
          configMap:
            name: nautobot-config
        - name: media
          persistentVolumeClaim:
            claimName: nautobot-media
