trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - group_vars/dev/nautobot.yml
      - group_vars/all/nautobot.yml
      - helm/nautobot/**

pool:
  name: 'ec2-agents'

variables:
  - group: nautobot-azure-secrets
  - name: DOCKER_REGISTRY
    value: "docker.io"
  - name: IMAGE_NAME
    value: "nautobot-custom"
  - name: K8S_NAMESPACE
    value: "nautobot"
  - name: DEPLOYMENT_NAME
    value: "nautobot-web"

stages:
  - stage: DetectChanges
    displayName: 'Detect Configuration Changes'
    jobs:
      - job: AnalyzeChanges
        displayName: 'Analyze Config Changes'
        steps:
          - bash: |
              echo "=== Analyzing configuration changes ==="
              
              # Check if plugins were added/changed
              git diff HEAD~1 HEAD -- group_vars/dev/nautobot.yml | grep -i "plugin" && \
              echo "##vso[task.setvariable variable=PLUGINS_CHANGED;isOutput=true]true" || \
              echo "##vso[task.setvariable variable=PLUGINS_CHANGED;isOutput=true]false"
              
              # Check if configmap needs update
              git diff HEAD~1 HEAD -- group_vars/dev/nautobot.yml && \
              echo "##vso[task.setvariable variable=CONFIG_CHANGED;isOutput=true]true" || \
              echo "##vso[task.setvariable variable=CONFIG_CHANGED;isOutput=true]false"
              
            displayName: 'Detect Changes'
            name: detectChanges

  - stage: BuildImage
    displayName: 'Build Custom Image'
    dependsOn: DetectChanges
    condition: eq(dependencies.DetectChanges.outputs['AnalyzeChanges.detectChanges.PLUGINS_CHANGED'], 'true')
    jobs:
      - job: BuildDockerImage
        displayName: 'Build Custom Nautobot Image'
        steps:
          - bash: |
              echo "=== Building custom Nautobot image with plugins ==="
              
              # Create Dockerfile with plugins
              cat > /tmp/Dockerfile <<'DOCKERFILE'
              FROM networktocode/nautobot:3.0.6-py3.11
              
              # Install custom plugins
              USER root
              RUN pip install --no-cache-dir \
                  nautobot-device-lifecycle-mgmt \
                  nautobot-golden-config \
                  nautobot-data-validation-engine
              
              USER nautobot
              DOCKERFILE
              
              # Build image (optional - requires Docker registry setup)
              # docker build -t ${DOCKER_REGISTRY}/${IMAGE_NAME}:${BUILD_BUILDID} /tmp/
              # docker push ${DOCKER_REGISTRY}/${IMAGE_NAME}:${BUILD_BUILDID}
              
              echo "Image build completed: ${IMAGE_NAME}:${BUILD_BUILDID}"
            displayName: 'Build Docker Image'

  - stage: Deploy
    displayName: 'Deploy to Kubernetes'
    dependsOn:
      - DetectChanges
      - BuildImage
    condition: or(succeeded('BuildImage'), eq(dependencies.DetectChanges.outputs['AnalyzeChanges.detectChanges.CONFIG_CHANGED'], 'true'))
    jobs:
      - deployment: DeployToK8s
        displayName: 'Zero-Downtime K8s Deployment'
        environment: 'kubernetes-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                
                - bash: |
                    echo "=== Installing kubectl and helm ==="
                    curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                    chmod +x kubectl
                    sudo mv kubectl /usr/local/bin/
                    
                    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
                  displayName: 'Install K8s Tools'
                
                - bash: |
                    echo "=== Configuring kubectl access ==="
                    mkdir -p ~/.kube
                    echo "$KUBECONFIG_CONTENT" > ~/.kube/config
                    chmod 600 ~/.kube/config
                    
                    kubectl cluster-info
                    kubectl get nodes
                  displayName: 'Configure kubectl'
                  env:
                    KUBECONFIG_CONTENT: $(KUBECONFIG_CONTENT)
                
                - bash: |
                    echo "=== Updating ConfigMap from group_vars ==="
                    
                    # Parse nautobot.yml and update configmap
                    python3 <<'PYTHON'
                    import yaml
                    import os
                    
                    # Read group_vars
                    with open('group_vars/dev/nautobot.yml', 'r') as f:
                        config = yaml.safe_load(f)
                    
                    # Generate Python config
                    py_config = f"""
import os
from nautobot.core.settings import *

ALLOWED_HOSTS = ['*']
DEBUG = {str(config.get('nautobot_debug', False)).capitalize()}

DATABASES = {{
    'default': {{
        'NAME': '{config['nautobot_db']['name']}',
        'USER': os.getenv('NAUTOBOT_DB_USER', '{config['nautobot_db']['user']}'),
        'PASSWORD': os.getenv('NAUTOBOT_DB_PASSWORD', ''),
        'HOST': os.getenv('NAUTOBOT_DB_HOST', '{config['nautobot_db']['host']}'),
        'PORT': '{config['nautobot_db']['port']}',
        'ENGINE': '{config['nautobot_db']['engine']}',
        'CONN_MAX_AGE': {config['nautobot_db']['conn_max_age']},
    }}
}}

REDIS_HOST = os.getenv('NAUTOBOT_REDIS_HOST', '{config['nautobot_redis']['host']}')
REDIS_PORT = {config['nautobot_redis']['port']}
REDIS_PASSWORD = os.getenv('NAUTOBOT_REDIS_PASSWORD', '')

CACHES = {{
    'default': {{
        'BACKEND': 'django_redis.cache.RedisCache',
        'LOCATION': f'redis://:{'{REDIS_PASSWORD}'}@{'{REDIS_HOST}'}:{'{REDIS_PORT}'}/0',
        'OPTIONS': {{'CLIENT_CLASS': 'django_redis.client.DefaultClient'}},
    }}
}}

CELERY_BROKER_URL = f'redis://:{'{REDIS_PASSWORD}'}@{'{REDIS_HOST}'}:{'{REDIS_PORT}'}/1'
CELERY_RESULT_BACKEND = f'redis://:{'{REDIS_PASSWORD}'}@{'{REDIS_HOST}'}:{'{REDIS_PORT}'}/1'

SECRET_KEY = os.getenv('NAUTOBOT_SECRET_KEY')
METRICS_ENABLED = True
"""
                    
                    # Write to temp file
                    with open('/tmp/nautobot_config.py', 'w') as f:
                        f.write(py_config)
                    
                    print("Configuration generated successfully")
                    PYTHON
                    
                    # Update ConfigMap
                    kubectl create configmap nautobot-config \
                      --from-file=nautobot_config.py=/tmp/nautobot_config.py \
                      -n ${K8S_NAMESPACE} \
                      --dry-run=client -o yaml | kubectl apply -f -
                    
                    echo "ConfigMap updated successfully"
                  displayName: 'Update ConfigMap'
                
                - bash: |
                    echo "=== Performing Rolling Update with Zero Downtime ==="
                    
                    # Ensure rolling update strategy
                    kubectl patch deployment ${DEPLOYMENT_NAME} -n ${K8S_NAMESPACE} -p '{
                      "spec": {
                        "strategy": {
                          "type": "RollingUpdate",
                          "rollingUpdate": {
                            "maxSurge": 1,
                            "maxUnavailable": 0
                          }
                        }
                      }
                    }'
                    
                    # Trigger rollout by updating annotation
                    kubectl patch deployment ${DEPLOYMENT_NAME} -n ${K8S_NAMESPACE} -p \
                      "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"deployedAt\":\"$(date +%s)\"}}}}}"
                    
                    echo "Rollout triggered at $(date)"
                  displayName: 'Trigger Rolling Update'
                
                - bash: |
                    echo "=== Monitoring Rollout Progress ==="
                    
                    # Wait for rollout to complete
                    kubectl rollout status deployment/${DEPLOYMENT_NAME} -n ${K8S_NAMESPACE} --timeout=10m
                    
                    # Verify all pods are ready
                    kubectl get pods -n ${K8S_NAMESPACE} -l app.kubernetes.io/component=web
                    
                    # Check if any pods failed
                    FAILED_PODS=$(kubectl get pods -n ${K8S_NAMESPACE} -l app.kubernetes.io/component=web --field-selector=status.phase!=Running --no-headers | wc -l)
                    
                    if [ $FAILED_PODS -gt 0 ]; then
                      echo "ERROR: Some pods failed to start"
                      kubectl get pods -n ${K8S_NAMESPACE} -l app.kubernetes.io/component=web
                      exit 1
                    fi
                    
                    echo "✅ Deployment completed successfully with zero downtime"
                  displayName: 'Verify Deployment'
                
                - bash: |
                    echo "=== Running Health Checks ==="
                    
                    # Get LoadBalancer IP
                    LB_IP=$(kubectl get svc nautobot-lb -n ${K8S_NAMESPACE} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                    
                    if [ -z "$LB_IP" ]; then
                      echo "WARNING: LoadBalancer IP not found, using service IP"
                      LB_IP=$(kubectl get svc nautobot -n ${K8S_NAMESPACE} -o jsonpath='{.spec.clusterIP}')
                    fi
                    
                    # Test health endpoint
                    for i in {1..5}; do
                      echo "Health check attempt $i/5..."
                      if curl -f -s http://${LB_IP}/health/ > /dev/null 2>&1; then
                        echo "✅ Health check passed"
                        break
                      fi
                      sleep 10
                    done
                    
                    # Final verification
                    echo "=== Deployment Summary ==="
                    kubectl get deployment ${DEPLOYMENT_NAME} -n ${K8S_NAMESPACE}
                    kubectl get pods -n ${K8S_NAMESPACE} -l app.kubernetes.io/component=web
                    kubectl get svc -n ${K8S_NAMESPACE}
                    
                    echo ""
                    echo "🌐 Access URLs:"
                    echo "   LoadBalancer: http://${LB_IP}"
                    echo "   HTTPS: https://${LB_IP}"
                  displayName: 'Health Check & Summary'

  - stage: Rollback
    displayName: 'Rollback on Failure'
    dependsOn: Deploy
    condition: failed('Deploy')
    jobs:
      - job: RollbackDeployment
        displayName: 'Rollback to Previous Version'
        steps:
          - bash: |
              echo "=== Rolling back deployment ==="
              
              kubectl rollout undo deployment/${DEPLOYMENT_NAME} -n ${K8S_NAMESPACE}
              kubectl rollout status deployment/${DEPLOYMENT_NAME} -n ${K8S_NAMESPACE}
              
              echo "✅ Rollback completed"
            displayName: 'Rollback Deployment'
