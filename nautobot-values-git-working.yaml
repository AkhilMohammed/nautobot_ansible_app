# Nautobot Helm Values - Git Plugins Working Configuration
# This approach installs plugins at container startup, just like Azure VMs

image:
  repository: networktocode/nautobot
  tag: "3.0.6-py3.11"
  pullPolicy: IfNotPresent

# Disable init containers - plugins will be installed in main container startup
initContainers:
  enabled: false

nautobot:
  secretKey: "12rva+@-bi(#s)18^e3y22*4oki2um5o(^qwwyd=iyi95(4)"
  debug: false
  logLevel: INFO
  allowedHosts:
    - "*"
  
  # Enable Git-based plugins - will be installed at container startup
  plugins:
    enabled: true
    packages:
      # Device Lifecycle Management
      - name: "git+https://github.com/nautobot/nautobot-app-device-lifecycle-mgmt.git@develop#egg=nautobot-device-lifecycle-mgmt"
        module: "nautobot_device_lifecycle_mgmt"
      # DNS Models
      - name: "git+https://github.com/nautobot/nautobot-app-dns-models.git@develop#egg=nautobot-dns-models"
        module: "nautobot_dns_models"
      # BGP Models
      - name: "git+https://github.com/nautobot/nautobot-app-bgp-models.git@develop#egg=nautobot-bgp-models"
        module: "nautobot_bgp_models"
      # Firewall Models
      - name: "git+https://github.com/nautobot/nautobot-app-firewall-models.git@develop#egg=nautobot-firewall-models"
        module: "nautobot_firewall_models"
    
    # Plugin configuration dict (used by PLUGINS_CONFIG in nautobot_config.py)
    config:
      nautobot_device_lifecycle_mgmt: {}
      nautobot_dns_models: {}
      nautobot_bgp_models: {}
      nautobot_firewall_models: {}

database:
  host: nautobot-postgresql
  port: 5432
  name: nautobot
  user: nautobot
  password: "nautobot_db_password_change_me"

redis:
  host: nautobot-redis
  port: 6379
  database: 0
  password: ""

celery:
  brokerUrl: "redis://nautobot-redis:6379/0"
  resultBackend: "redis://nautobot-redis:6379/1"

# Web deployment configuration
web:
  replicas: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  livenessProbe:
    enabled: true
    initialDelaySeconds: 300  # Increased for plugin installation time
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6
    httpGet:
      path: /health/
      port: 8080
  readinessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 10
    httpGet:
      path: /health/
      port: 8080

# Worker deployment configuration
worker:
  replicas: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# Scheduler deployment configuration
scheduler:
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    username: nautobot
    password: "nautobot_db_password_change_me"
    database: nautobot
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

# Redis configuration
redisComponent:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

# Service configuration
service:
  type: LoadBalancer
  port: 8000
  targetPort: 8080
  loadBalancerIP: 172.17.152.200

# Persistence for media/static files
persistence:
  enabled: true
  storageClass: "local-path"  # Match existing PVCs
  media:
    size: 10Gi  # Match existing size
  static:
    size: 2Gi
  git:
    size: 5Gi  # Match existing size

serviceAccount:
  create: true
  name: nautobot

podSecurityContext:
  fsGroup: 999
  runAsUser: 999
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
