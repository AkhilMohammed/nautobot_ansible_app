# ============================================================
# Add this job to your azure-pipelines.yml Build stage
# ============================================================
# Insert after the "Validate" job and before the "Package" job
# ============================================================

- job: CodeQuality
  displayName: 'SonarQube Code Quality Analysis'
  dependsOn: Validate
  condition: succeeded()
  steps:
    - bash: |
        set -e
        echo "======================================"
        echo "Installing SonarQube Scanner"
        echo "======================================"
        
        SCANNER_VERSION="5.0.1.3006"
        SCANNER_DIR="sonar-scanner-${SCANNER_VERSION}-linux"
        
        cd /tmp
        if [ ! -d "$SCANNER_DIR" ]; then
          wget -q "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SCANNER_VERSION}-linux.zip"
          unzip -q "sonar-scanner-cli-${SCANNER_VERSION}-linux.zip"
          rm "sonar-scanner-cli-${SCANNER_VERSION}-linux.zip"
        fi
        
        export PATH="/tmp/${SCANNER_DIR}/bin:$PATH"
        sonar-scanner --version
        
        echo "======================================"
        echo "Running SonarQube Analysis"
        echo "======================================"
        
        cd $(Build.SourcesDirectory)
        
        # Run SonarQube scanner
        sonar-scanner \
          -Dsonar.host.url=http://172.17.152.204:9000 \
          -Dsonar.token=$(SONARQUBE_TOKEN) \
          -Dsonar.projectKey=nautobot-ansible-app \
          -Dsonar.projectName="Nautobot Ansible Application" \
          -Dsonar.projectVersion=$(Build.BuildNumber) \
          -Dsonar.sources=playbooks,roles,group_vars,host_vars,scripts \
          -Dsonar.exclusions="**/*.pyc,**/__pycache__/**,**/node_modules/**,**/.terraform/**,**/venv/**,**/vault.yml" \
          -Dsonar.python.version=3.11 \
          -Dsonar.yaml.file.suffixes=.yml,.yaml \
          -Dsonar.sourceEncoding=UTF-8 \
          -Dsonar.working.directory=$(Build.SourcesDirectory)/.scannerwork
        
        echo ""
        echo "======================================"
        echo "SonarQube Analysis Complete!"
        echo "======================================"
        echo "View results at: http://172.17.152.204:9000/dashboard?id=nautobot-ansible-app"
        echo ""
      displayName: 'Run SonarQube Scan'
      env:
        SONARQUBE_TOKEN: $(SONARQUBE_TOKEN)
      continueOnError: true  # Don't fail pipeline initially while fixing issues

