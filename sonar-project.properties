# SonarQube Project Configuration for Nautobot Ansible Deployment

# Project identification
sonar.projectKey=nautobot-ansible-app
sonar.projectName=Nautobot Ansible Application
sonar.projectVersion=1.0

# Source code location
sonar.sources=playbooks,roles,group_vars,host_vars,scripts
sonar.exclusions=**/*.pyc,**/__pycache__/**,**/node_modules/**,**/.terraform/**,**/venv/**

# Python specific settings
sonar.python.version=3.11

# Ansible/YAML specific settings
sonar.yaml.file.suffixes=.yml,.yaml

# Test coverage (if you add tests later)
# sonar.python.coverage.reportPaths=coverage.xml
# sonar.python.xunit.reportPath=test-results.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Analysis parameters
sonar.verbose=false
sonar.log.level=INFO

# Quality profiles
# sonar.qualitygate.wait=true
# sonar.qualitygate.timeout=300
