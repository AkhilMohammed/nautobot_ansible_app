---
# GitHub Actions Workflow for On-Premises Nautobot Deployment
# Automatically deploys when configuration or plugin changes are detected

name: Deploy Nautobot On-Premises

on:
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Deployment Type'
        required: true
        type: choice
        options:
          - vm_deployment
          - k8s_production
          - validate_only
      deployment_stage:
        description: 'Deployment Stage (for VM deployment)'
        required: false
        type: choice
        options:
          - validate
          - infrastructure
          - application
          - full_stack

  push:
    branches:
      - feat/onprem-deployment
      - main
    paths:
      - 'playbooks/**'
      - 'roles/**'
      - 'inventory/**/*.yml'
      - 'group_vars/**/nautobot.yml'  # Auto-triggers on plugin config changes!
      - 'group_vars/**/vault.yml'
      - 'group_vars/dev/**'
      - 'group_vars/test/**'
      - 'group_vars/prod/**'
      - 'group_vars/onprem/**'
      - 'helm/**'

  pull_request:
    branches:
      - main
    paths:
      - 'playbooks/**'
      - 'roles/**'
      - 'group_vars/**'

jobs:
  detect-changes:
    name: Detect Configuration Changes
    runs-on: [self-hosted, onprem]
    outputs:
      deployment_type: ${{ steps.detect.outputs.deployment_type }}
      config_changed: ${{ steps.detect.outputs.config_changed }}
      plugins_changed: ${{ steps.detect.outputs.plugins_changed }}
      environment: ${{ steps.detect.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes and deployment type
        id: detect
        run: |
          echo "🔍 Detecting changes in configuration..."
          
          # Determine deployment type based on inventory
          if [ -f "inventory/k8s/onprem.yml" ] && [ -s "inventory/k8s/onprem.yml" ]; then
            echo "deployment_type=k8s_production" >> $GITHUB_OUTPUT
            echo "📦 Detected: Kubernetes deployment"
          else
            echo "deployment_type=vm_deployment" >> $GITHUB_OUTPUT
            echo "📦 Detected: VM deployment"
          fi
          
          # Detect which environment changed
          if git diff --name-only HEAD^ HEAD | grep -q "group_vars/dev/"; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD^ HEAD | grep -q "group_vars/prod/"; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD^ HEAD | grep -q "group_vars/onprem/"; then
            echo "environment=onprem" >> $GITHUB_OUTPUT
          else
            echo "environment=onprem" >> $GITHUB_OUTPUT
          fi
          
          # Check if any config files changed
          if git diff --name-only HEAD^ HEAD | grep -E "group_vars.*/nautobot.yml"; then
            echo "config_changed=true" >> $GITHUB_OUTPUT
            echo "✅ Configuration changes detected in nautobot.yml"
          else
            echo "config_changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No configuration changes detected"
          fi
          
          # Check specifically for plugin configuration changes
          if git diff HEAD^ HEAD -- group_vars/**/nautobot.yml | grep -i "nautobot_plugins"; then
            echo "plugins_changed=true" >> $GITHUB_OUTPUT
            echo "🔌 Plugin configuration changes detected - will trigger automatic deployment!"
            echo ""
            echo "Changed plugins:"
            git diff HEAD^ HEAD -- group_vars/**/nautobot.yml | grep -A 5 "nautobot_plugins" || true
          else
            echo "plugins_changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No plugin changes detected"
          fi

      - name: Display detection summary
        run: |
          echo "📊 Detection Summary:"
          echo "  Deployment Type: ${{ steps.detect.outputs.deployment_type }}"
          echo "  Environment: ${{ steps.detect.outputs.environment }}"
          echo "  Config Changed: ${{ steps.detect.outputs.config_changed }}"
          echo "  Plugins Changed: ${{ steps.detect.outputs.plugins_changed }}"

  validate:
    name: Validate Ansible Syntax
    runs-on: [self-hosted, onprem]
    needs: detect-changes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

#       - name: Setup Python
#         uses: actions/setup-python@v5
#         with:
#           python-version: '3.12'

      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible

      - name: Validate VM playbook
        run: |
          ansible-playbook --syntax-check \
            -i inventory/vm/onprem.yml \
            playbooks/deploy_onprem_all.yml
        continue-on-error: true

      - name: Validate K8s playbook
        run: |
          ansible-playbook --syntax-check \
            -i inventory/k8s/onprem.yml \
            playbooks/deploy_k8s_production.yml
        continue-on-error: true

  auto_deploy_k8s:
    name: 🚀 Auto-Deploy K8s (Config/Plugin Changes)
    runs-on: [self-hosted, onprem]
    needs: [detect-changes, validate]
    if: |
      github.event_name == 'push' &&
      needs.detect-changes.outputs.deployment_type == 'k8s_production' &&
      (needs.detect-changes.outputs.config_changed == 'true' || needs.detect-changes.outputs.plugins_changed == 'true')
    environment: onprem
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

#       - name: Setup Python
#         uses: actions/setup-python@v5
#         with:
#           python-version: '3.12'

      - name: Install Ansible and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible python3-kubernetes

      - name: Auto-Deploy K8s with Config/Plugin Changes
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          echo "🚀 AUTO-DEPLOYMENT TRIGGERED"
          echo "================================"
          echo "Reason: Configuration or plugin changes detected"
          echo "Environment: ${{ needs.detect-changes.outputs.environment }}"
          echo "Deploying to: Kubernetes cluster"
          echo ""
          
          ansible-playbook -i inventory/k8s/onprem.yml \
            playbooks/deploy_k8s_production.yml \
            --tags "nautobot,app" \
            --vault-password-file ${{ secrets.ANSIBLE_VAULT_PASSWORD_FILE }} \
            -v

      - name: Deployment Summary
        run: |
          echo "✅ AUTOMATIC DEPLOYMENT COMPLETED"
          echo "================================"
          echo "Kubernetes deployment finished successfully"
          echo "All pods have been updated with new configuration"
          echo ""
          echo "To verify deployment:"
          echo "  kubectl get pods -n nautobot"
          echo "  kubectl logs -n nautobot -l app.kubernetes.io/name=nautobot"

  auto_deploy_vm:
    name: 🚀 Auto-Deploy VM (Config/Plugin Changes)
    runs-on: [self-hosted, onprem]
    needs: [detect-changes, validate]
    if: |
      github.event_name == 'push' &&
      needs.detect-changes.outputs.deployment_type == 'vm_deployment' &&
      (needs.detect-changes.outputs.config_changed == 'true' || needs.detect-changes.outputs.plugins_changed == 'true')
    environment: onprem
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

#       - name: Setup Python
#         uses: actions/setup-python@v5
#         with:
#           python-version: '3.12'

      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible

      - name: Auto-Deploy VM with Config/Plugin Changes
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          echo "🚀 AUTO-DEPLOYMENT TRIGGERED"
          echo "================================"
          echo "Reason: Configuration or plugin changes detected"
          echo "Environment: ${{ needs.detect-changes.outputs.environment }}"
          echo "Deploying to: VM infrastructure"
          echo ""
          
          ansible-playbook -i inventory/vm/onprem.yml \
            playbooks/deploy_onprem_all.yml \
            --tags "nautobot,app" \
            --vault-password-file ${{ secrets.ANSIBLE_VAULT_PASSWORD_FILE }} \
            -v

      - name: Deployment Summary
        run: |
          echo "✅ AUTOMATIC DEPLOYMENT COMPLETED"
          echo "================================"
          echo "VM deployment finished successfully"
          echo "All services have been updated with new configuration"
          echo ""
          echo "Services status:"
          echo "  systemctl status nautobot.service"
          echo "  systemctl status nautobot-worker.service"

  # Manual deployment jobs below
  deploy_k8s_production:
    name: Manual Deploy - K8s Production
    runs-on: [self-hosted, onprem]
    needs: validate
    if: github.event.inputs.deployment_type == 'k8s_production'
    environment: onprem
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

#       - name: Setup Python
#         uses: actions/setup-python@v5
#         with:
#           python-version: '3.12'

      - name: Install Ansible and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible python3-kubernetes

      - name: Deploy Full Production K8s Stack
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i inventory/k8s/onprem.yml \
            playbooks/deploy_k8s_production.yml \
            --vault-password-file ${{ secrets.ANSIBLE_VAULT_PASSWORD_FILE }}

  deploy_infrastructure:
    name: Manual Deploy - Infrastructure
    runs-on: [self-hosted, onprem]
    needs: validate
    if: |
      github.event.inputs.deployment_type == 'vm_deployment' && 
      (github.event.inputs.deployment_stage == 'infrastructure' || github.event.inputs.deployment_stage == 'full_stack')
    environment: onprem
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

#       - name: Setup Python
#         uses: actions/setup-python@v5
#         with:
#           python-version: '3.12'

      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible

      - name: Deploy PostgreSQL and Redis
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i inventory/vm/onprem.yml \
            playbooks/deploy_onprem_all.yml \
            --tags "postgres,redis" \
            --vault-password-file ${{ secrets.ANSIBLE_VAULT_PASSWORD_FILE }}

  deploy_application:
    name: Manual Deploy - Application
    runs-on: [self-hosted, onprem]
    needs: [validate, deploy_infrastructure]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.deploy_infrastructure.result == 'success' || needs.deploy_infrastructure.result == 'skipped') &&
      github.event.inputs.deployment_type == 'vm_deployment' &&
      (github.event.inputs.deployment_stage == 'application' || github.event.inputs.deployment_stage == 'full_stack')
    environment: onprem
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

#       - name: Setup Python
#         uses: actions/setup-python@v5
#         with:
#           python-version: '3.12'

      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible

      - name: Deploy Nautobot Application
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i inventory/vm/onprem.yml \
            playbooks/deploy_onprem_all.yml \
            --tags "nautobot,web,worker,scheduler" \
            --vault-password-file ${{ secrets.ANSIBLE_VAULT_PASSWORD_FILE }}
