---
# Development Environment Configuration

nautobot_user: "nautobot"
nautobot_group: "nautobot"
nautobot_root: "/opt/nautobot"
nautobot_venv: "{{ nautobot_root }}/venv"
nautobot_config_path: "{{ nautobot_root }}/nautobot_config.py"
nautobot_logs_path: "{{ nautobot_root }}/logs"
nautobot_media_path: "{{ nautobot_root }}/media"
nautobot_static_path: "{{ nautobot_root }}/static"
nautobot_git_path: "{{ nautobot_root }}/git"
nautobot_git_root: "{{ nautobot_root }}/.nautobot"
nautobot_jobs_root: "{{ nautobot_root }}/jobs"
python_version: "python3.11"
nautobot_environment: dev
nautobot_debug: true
nautobot_log_level: DEBUG
nautobot_version: "3.0.6"

systemd_path: "/etc/systemd/system"

# Database Configuration
nautobot_db:
  engine: "django.db.backends.postgresql"
  name: "{{ database_name | default('nautobot') }}"
  user: "{{ database_user | default('nautobot') }}"
  password: "{{ database_password | default(vault_nautobot_db_password) }}"
  host: "{{ database_host | default('localhost') }}"
  port: "{{ database_port | default(5432) }}"
  conn_max_age: "{{ database_conn_max_age | default(300) }}"
  options:
    sslmode: "{{ database_ssl_mode | default('prefer') }}"

# Redis Configuration
nautobot_redis:
  host: "{{ redis_host | default('localhost') }}"
  port: "{{ redis_port | default(6379) }}"
  database: 0
  password: "{{ redis_password | default('') }}"
  ssl: "{{ redis_ssl | default(false) }}"

# Celery Configuration
nautobot_celery_broker_url: "{{ 'rediss' if redis_ssl | default(false) else 'redis' }}://{{ nautobot_redis.host }}:{{ nautobot_redis.port }}/{{ nautobot_redis.database }}"
nautobot_celery_result_backend: "{{ 'rediss' if redis_ssl | default(false) else 'redis' }}://{{ nautobot_redis.host }}:{{ nautobot_redis.port }}/1"

# Allowed Hosts
# nautobot_allowed_hosts:
#   - "localhost"
#   - "127.0.0.1"
#   - "dev-nautobot.internal"
#   - "172.17.228.201"
#   - "*.dev.internal"

# Base hosts allowed everywhere
nautobot_allowed_hosts_base:
  - "localhost"
  - "127.0.0.1"
  - "172.17.228.202"

# Dynamically add this host's IP / inventory name
nautobot_allowed_hosts: >-
  {{
    nautobot_allowed_hosts_base
    + [ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) ]
  }}


# SECRET KEY (dev only - use vault in prod)
nautobot_secret_key: "dev-secret-key-change-in-production"

# Admin user (dev defaults; override via vault in prod)
nautobot_admin_username: "{{ vault_nautobot_admin_username | default('admin') }}"
nautobot_admin_password: "{{ vault_nautobot_admin_password | default('admin') }}"
nautobot_admin_email: "{{ vault_nautobot_admin_email | default('admin@example.com') }}"

# ===========================
# PLUGINS INSTALLATION
# ===========================

# This is for installing packages directly from internal repositories
nautobot_pip_packages:
  # Core dependencies
  - name: "social-auth-core[openidconnect]"
    version: "4.3.0"
  
  - name: "netutils"
    version: "1.10.0"
  
  - name: "azure-storage-blob"
    version: "12.21.0"  

  # Runtime dependencies for Nautobot worker
  - name: "django-jinja"
  - name: "psycopg2-binary"

# Azure DevOps is used - runner job synced from Git repo
# Your custom plugins installed from Git branches
nautobot_git_packages:
  # Official NTC plugins from GitHub (develop branch)
  - name: "git+https://{{ git_auth_url_safe }}github.com/nautobot/nautobot-app-ssot.git@develop#egg=nautobot-ssot"
    version: "develop"
    module_name: "nautobot_ssot"

  - name: "git+https://{{ git_auth_url_safe }}github.com/nautobot/nautobot-app-golden-config.git@develop#egg=nautobot-golden-config"
    version: "develop"
    module_name: "nautobot_golden_config"
  
  - name: "git+https://{{ git_auth_url_safe }}github.com/nautobot/nautobot-app-device-lifecycle-mgmt.git@develop#egg=nautobot-device-lifecycle-mgmt"
    version: "develop"
    module_name: "nautobot_device_lifecycle_mgmt"

  # DNS Models plugin (dev)
  - name: "git+https://{{ git_auth_url_safe }}github.com/nautobot/nautobot-app-dns-models.git@develop#egg=nautobot-dns-models"
    version: "develop"
    module_name: "nautobot_dns_models"

# Blocklist legacy/incompatible plugins that may be injected via vault
nautobot_git_packages_blocklist:
  - "nautobot_plugin_example"

nautobot_git_packages_blocklist_regex: "nautobot-plugin-device-tracker|nautobot-plugin-example"

# Plugin Configuration
nautobot_plugins_config:
  nautobot_plugin_a:
    enable_feature_x: true
    api_timeout: 30
    debug_mode: true
  
  nautobot_plugin_b:
    batch_size: 100
    enable_sync: true
  
  nautobot_ssot:
    hide_example_jobs: true
  
  nautobot_golden_config:
    enable_backup: true
    enable_compliance: true
    enable_intended: true

  nautobot_dns_models: {}

# Celery worker configuration
nautobot_celery_worker_count: 2
nautobot_celery_worker_autoscale: "4,2"

# Service names
nautobot_services:
  - nautobot-gunicorn
  - nginx 
  - nautobot-worker
  - nautobot-scheduler
