---
- name: Deploy nautobot-worker systemd service
  ansible.builtin.copy:
    dest: "{{ systemd_path }}/nautobot-worker.service"
    mode: "0644"
    content: |
      [Unit]
      Description=Nautobot Celery Worker
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User={{ nautobot_user }}
      Group={{ nautobot_group }}
      WorkingDirectory={{ nautobot_root }}
      Environment="NAUTOBOT_CONFIG={{ nautobot_config_path }}"
      ExecStart={{ nautobot_venv }}/bin/nautobot-server celery worker \
            --loglevel {{ nautobot_log_level }} \
            --concurrency {{ nautobot_celery_worker_count }} \
            --autoscale={{ nautobot_celery_worker_autoscale }}
      Restart=on-failure
      RestartSec=30s

      [Install]
      WantedBy=multi-user.target
  notify: Reload systemd

- name: Enable and start nautobot-worker service
  ansible.builtin.systemd:
    name: nautobot-worker
    enabled: yes
    state: started
    daemon_reload: yes

- name: Check nautobot-worker service status
  ansible.builtin.command:
    cmd: systemctl is-active nautobot-worker
  register: nautobot_worker_active
  changed_when: false
  failed_when: false

- name: Collect nautobot-worker logs on failure
  ansible.builtin.command:
    cmd: journalctl -u nautobot-worker -n 200 --no-pager
  register: nautobot_worker_logs
  changed_when: false
  when: nautobot_worker_active.stdout is defined and nautobot_worker_active.stdout != "active"

- name: Show nautobot-worker logs
  ansible.builtin.debug:
    msg: "{{ nautobot_worker_logs.stdout }}"
  when: nautobot_worker_logs is defined

- name: Fail if nautobot-worker is not active
  ansible.builtin.fail:
    msg: "nautobot-worker is not active. See logs above."
  when: nautobot_worker_active.stdout is defined and nautobot_worker_active.stdout != "active"
