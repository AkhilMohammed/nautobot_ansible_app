{{- if .Values.worker.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nautobot.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nautobot.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  {{- with .Values.worker.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.worker.service.type }}
  ports:
    - name: metrics
      port: {{ .Values.worker.service.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "nautobot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  sessionAffinity: None
{{- end }}
