# Nautobot Helm Chart - Production Configuration
# Last updated: 2026-02-13 - Deployment with vault password support

# Docker image configuration
image:
  repository: networktocode/nautobot
  tag: "3.0.6-py3.11"
  pullPolicy: IfNotPresent

# Nautobot Web (UI/API) Configuration
web:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  nodeSelector: {}
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - web
            topologyKey: kubernetes.io/hostname
  livenessProbe:
    enabled: true
    httpGet:
      path: /health/
      port: 8000
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    httpGet:
      path: /health/
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Celery Worker Configuration
worker:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 3Gi
  nodeSelector: {}
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - worker
            topologyKey: kubernetes.io/hostname
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  # Worker Service (optional - for metrics endpoint)
  service:
    enabled: false  # Enable if you need to expose worker metrics
    type: ClusterIP
    port: 9090
    annotations: {}

# Celery Beat Scheduler Configuration
scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}

# Database Configuration (External or Internal)
database:
  host: "192.168.1.16"  # Will be overridden by Ansible or use internal service
  port: 5432
  name: nautobot
  engine: django.db.backends.postgresql
  # Credentials in secrets
  existingSecret: nautobot-secrets
  usernameKey: db-user
  passwordKey: db-password

# PostgreSQL Internal Service (Optional - runs in K8s cluster)
postgresql:
  enabled: true  # Set to true to run PostgreSQL in the cluster
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  database: nautobot
  existingSecret: nautobot-secrets
  usernameKey: db-user
  passwordKey: db-password
  service:
    type: ClusterIP
    port: 5432
    annotations: {}
  persistence:
    enabled: true
    size: 20Gi
    storageClass: "local-path"  # Match existing PVCs
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  nodeSelector: {}
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999

# Redis Configuration (External or Internal)
redis:
  host: "192.168.1.17"  # Will be overridden by Ansible or use internal service
  port: 6379
  database: 0
  # Password in secrets
  existingSecret: nautobot-secrets
  passwordKey: redis-password
  ssl: false
  # Internal Redis Service (Optional - runs in K8s cluster)
  enabled: true  # Set to true to run Redis in the cluster
  replicas: 1
  password: true  # Enable password authentication
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
    annotations: {}
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "local-path"  # Match existing PVCs
  maxmemory: "512mb"
  maxmemoryPolicy: "allkeys-lru"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999

# Nautobot Application Configuration
nautobot:
  secretKeySecret: nautobot-secrets
  superuser:
    enabled: true
    username: admin
    email: admin@example.com
    passwordSecret: nautobot-secrets
    passwordKey: superuser-password
  allowedHosts:
    - "*"
  debug: false
  logLevel: INFO
  metricsEnabled: true

# Persistent Storage
persistence:
  enabled: true
  storageClass: "local-path"  # Match existing PVCs
  media:
    size: 10Gi
    accessMode: ReadWriteOnce
  static:
    size: 2Gi
    accessMode: ReadWriteOnce
  git:
    size: 5Gi
    accessMode: ReadWriteOnce

# Service Configuration
service:
  type: ClusterIP
  port: 8000
  annotations: {}

# Ingress Configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  host: nautobot.local  # Will be overridden by Ansible
  tls:
    enabled: false
    secretName: nautobot-tls

# Security Context (Container level - no fsGroup)
securityContext:
  runAsNonRoot: true
  runAsUser: 999
  capabilities:
    drop:
      - ALL

# Pod Security Policy (Pod level - fsGroup allowed here)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  fsGroup: 999

# Service Account
serviceAccount:
  create: true
  name: nautobot
  annotations: {}

# Init Containers
initContainers:
  enabled: true
  migrations:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Metrics and Monitoring
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s

# Extra environment variables
extraEnv: []

# Extra volumes
extraVolumes: []

# Extra volume mounts
extraVolumeMounts: []
# Secrets configured - testing automated deployment
# Testing passwordless sudo deployment
