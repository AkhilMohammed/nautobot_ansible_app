# Nautobot Helm Chart - Production Configuration
# Last updated: 2026-02-17 - Plugin support fully functional
# Plugins are automatically installed via init containers with device-lifecycle-mgmt v4.0.0

# Docker image configuration
image:
  repository: networktocode/nautobot
  tag: "3.0.6-py3.11"
  pullPolicy: IfNotPresent

# Nautobot Web (UI/API) Configuration
web:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  nodeSelector: {}
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - web
            topologyKey: kubernetes.io/hostname
  livenessProbe:
    enabled: false  # Temporarily disabled to speed up deployment
    httpGet:
      path: /health/
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: false  # Temporarily disabled to speed up deployment
    httpGet:
      path: /health/
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Celery Worker Configuration
worker:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 3Gi
  nodeSelector: {}
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - worker
            topologyKey: kubernetes.io/hostname
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  # Worker Service (optional - for metrics endpoint)
  service:
    enabled: false  # Enable if you need to expose worker metrics
    type: ClusterIP
    port: 9090
    annotations: {}

# Celery Beat Scheduler Configuration
scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}

# Database Configuration (External or Internal)
database:
  host: "192.168.1.16"  # Will be overridden by Ansible or use internal service
  port: 5432
  name: nautobot
  engine: django.db.backends.postgresql
  # Credentials in secrets
  existingSecret: nautobot-secrets
  usernameKey: db-user
  passwordKey: db-password

# PostgreSQL Internal Service (Optional - runs in K8s cluster)
postgresql:
  enabled: true  # Set to true to run PostgreSQL in the cluster
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  database: nautobot
  existingSecret: nautobot-secrets
  usernameKey: db-user
  passwordKey: db-password
  service:
    type: ClusterIP
    port: 5432
    annotations: {}
  persistence:
    enabled: true
    size: 20Gi
    storageClass: "local-path"  # Match existing PVCs
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  nodeSelector: {}
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999

# Redis Configuration (External or Internal)
redis:
  host: "192.168.1.17"  # Will be overridden by Ansible or use internal service
  port: 6379
  database: 0
  # Password in secrets
  existingSecret: nautobot-secrets
  passwordKey: redis-password
  ssl: false
  # Internal Redis Service (Optional - runs in K8s cluster)
  enabled: true  # Set to true to run Redis in the cluster
  replicas: 1
  password: true  # Enable password authentication
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
    annotations: {}
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "local-path"  # Match existing PVCs
  maxmemory: "512mb"
  maxmemoryPolicy: "allkeys-lru"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999

# Nautobot Application Configuration
nautobot:
  secretKeySecret: nautobot-secrets
  superuser:
    enabled: true
    username: admin
    email: admin@example.com
    passwordSecret: nautobot-secrets
    passwordKey: superuser-password
  allowedHosts:
    - "*"
  debug: false
  logLevel: INFO
  metricsEnabled: true
  
  # Plugins Configuration
  plugins:
    enabled: true  # Re-enabled with DNS and BGP plugins
    packages:
      - name: nautobot-device-lifecycle-mgmt  # pip package name
        module: nautobot_device_lifecycle_mgmt  # Python module name (used in PLUGINS list)
        version: ""  # Auto-detect latest compatible version
      - name: nautobot-bgp-models
        module: nautobot_bgp_models
        version: ""  # Auto-detect latest compatible version
      - name: nautobot-dns-manager
        module: nautobot_dns_manager
        version: ""  # Auto-detect latest compatible version
    config:
      nautobot_device_lifecycle_mgmt: {}
      nautobot_bgp_models: {}
      nautobot_dns_manager: {}

# Persistent Storage
persistence:
  enabled: true
  storageClass: "local-path"  # Match existing PVCs
  media:
    size: 10Gi
    accessMode: ReadWriteOnce
  static:
    size: 2Gi
    accessMode: ReadWriteOnce
  git:
    size: 5Gi
    accessMode: ReadWriteOnce

# Service Configuration
service:
  type: LoadBalancer  # LoadBalancer for direct external access
  port: 8000
  annotations:
    # MetalLB annotations
    metallb.universe.tf/allow-shared-ip: nautobot
    # Prometheus monitoring
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"

# Ingress Configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    # SSL/TLS Configuration
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # Change to your issuer
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    # Proxy settings
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    # Monitoring
    prometheus.io/scrape: "true"
    prometheus.io/port: "10254"
  hosts:
    - host: nautobot.local  # Change to your domain
      paths:
        - path: /
          pathType: Prefix
  host: nautobot.local  # Legacy single host for backward compatibility
  tls:
    enabled: true  # Enable TLS for production
    secretName: nautobot-tls
  certManager:
    enabled: false  # Disabled - using manual self-signed certificate
    issuer: selfsigned-issuer  # Self-signed Issuer name
    issuerKind: Issuer  # ClusterIssuer or Issuer
    duration: 8760h  # 1 year
    renewBefore: 720h  # 30 days before expiry

# Security Context (Container level - no fsGroup)
securityContext:
  runAsNonRoot: true
  runAsUser: 999
  capabilities:
    drop:
      - ALL

# Pod Security Policy (Pod level - fsGroup allowed here)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  fsGroup: 999

# Service Account
serviceAccount:
  create: true
  name: nautobot
  annotations: {}

# Init Containers
initContainers:
  enabled: true  # Re-enabled for plugin installation
  migrations:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Metrics and Monitoring
metrics:
  enabled: true
  serviceMonitor:
    enabled: true  # Enable for Prometheus Operator
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: prometheus  # Match your Prometheus operator label
    honorLabels: true
  prometheusRule:
    enabled: true  # Enable alerting rules
    labels:
      release: prometheus

# Extra environment variables
extraEnv: []

# Extra volumes
extraVolumes: []

# Extra volume mounts
extraVolumeMounts: []
# Secrets configured - testing automated deployment
# Testing passwordless sudo deployment
