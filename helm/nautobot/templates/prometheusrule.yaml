{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "nautobot.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nautobot.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: nautobot.rules
      interval: 30s
      rules:
        # High Pod Memory Usage
        - alert: NautobotHighMemoryUsage
          expr: |
            container_memory_usage_bytes{namespace="{{ .Release.Namespace }}", container="nautobot"} 
            / container_spec_memory_limit_bytes{namespace="{{ .Release.Namespace }}", container="nautobot"} > 0.9
          for: 5m
          labels:
            severity: warning
            component: nautobot
          annotations:
            summary: "Nautobot pod {{ "{{" }} $labels.pod {{ "}}" }} high memory usage"
            description: "Pod {{ "{{" }} $labels.pod {{ "}}" }} memory usage is above 90% (current: {{ "{{" }} $value {{ "}}" }})"
        
        # High Pod CPU Usage
        - alert: NautobotHighCPUUsage
          expr: |
            rate(container_cpu_usage_seconds_total{namespace="{{ .Release.Namespace }}", container="nautobot"}[5m]) > 0.8
          for: 5m
          labels:
            severity: warning
            component: nautobot
          annotations:
            summary: "Nautobot pod {{ "{{" }} $labels.pod {{ "}}" }} high CPU usage"
            description: "Pod {{ "{{" }} $labels.pod {{ "}}" }} CPU usage is above 80%"
        
        # Pod Restart Rate
        - alert: NautobotPodRestarts
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}", container="nautobot"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
            component: nautobot
          annotations:
            summary: "Nautobot pod {{ "{{" }} $labels.pod {{ "}}" }} is restarting"
            description: "Pod {{ "{{" }} $labels.pod {{ "}}" }} has restarted {{ "{{" }} $value {{ "}}" }} times in the last 15 minutes"
        
        # Pod Not Ready
        - alert: NautobotPodNotReady
          expr: |
            kube_pod_status_ready{namespace="{{ .Release.Namespace }}", condition="false"} == 1
          for: 5m
          labels:
            severity: critical
            component: nautobot
          annotations:
            summary: "Nautobot pod {{ "{{" }} $labels.pod {{ "}}" }} is not ready"
            description: "Pod {{ "{{" }} $labels.pod {{ "}}" }} has been in not-ready state for more than 5 minutes"
        
        # Database Connection Issues
        - alert: NautobotDatabaseConnectionFailed
          expr: |
            nautobot_database_connection_errors_total > 10
          for: 2m
          labels:
            severity: critical
            component: database
          annotations:
            summary: "Nautobot database connection errors detected"
            description: "Database connection errors exceeded threshold ({{ "{{" }} $value {{ "}}" }} errors)"
        
        # High Response Time
        - alert: NautobotHighResponseTime
          expr: |
            histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{namespace="{{ .Release.Namespace }}"}[5m])) > 3
          for: 5m
          labels:
            severity: warning
            component: performance
          annotations:
            summary: "Nautobot high response time"
            description: "95th percentile response time is above 3 seconds ({{ "{{" }} $value {{ "}}" }}s)"
        
        # Service Down
        - alert: NautobotServiceDown
          expr: |
            up{job="nautobot"} == 0
          for: 2m
          labels:
            severity: critical
            component: nautobot
          annotations:
            summary: "Nautobot service is down"
            description: "Nautobot service has been down for more than 2 minutes"
{{- end }}
