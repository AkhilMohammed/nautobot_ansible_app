apiVersion: apps/v1
kind: Deployment
metadata:
  name: nautobot-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nautobot.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "nautobot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "nautobot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "nautobot.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: nautobot-web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.nautobot.plugins.enabled }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "==> Installing Git plugins at runtime..."
              if ! command -v git >/dev/null 2>&1; then
                echo "Installing git..."
                pkill -9 apt apt-get dpkg || true
                rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock
                dpkg --configure -a
                while lsof /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock >/dev/null 2>&1; do echo "Waiting for apt/dpkg lock..."; sleep 2; done
                apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1 || true
              fi
              {{- range .Values.nautobot.plugins.packages }}
              echo "Installing: {{ .name }}"
              pip install --no-cache-dir {{ .name }} || (echo "ERROR: Failed to install {{ .name }}" && exit 1)
              {{- end }}
              echo "==> ✓ All plugins installed successfully!"
              
              echo "==> Configuring plugins (creating writable copy)..."
              cp /opt/nautobot/nautobot_config.py /tmp/nautobot_config.py
              cat >> /tmp/nautobot_config.py << 'PLUGIN_EOF'
              
              # Plugins - Dynamically configured after runtime installation
              PLUGINS = [
              {{- range .Values.nautobot.plugins.packages }}
                  "{{ .module }}",
              {{- end }}
              ]
              
              PLUGINS_CONFIG = {{ .Values.nautobot.plugins.config | toJson }}
              PLUGIN_EOF
              
              export NAUTOBOT_CONFIG=/tmp/nautobot_config.py
              echo "==> ✓ Plugins configured!"
              echo "==> Running migrations..."
              nautobot-server migrate --no-input
              echo "==> ✓ Migrations complete!"
              echo "==> Collecting static files..."
              nautobot-server collectstatic --no-input --clear
              echo "==> ✓ Static files collected!"
              echo "==> Starting Nautobot web..."
              exec nautobot-server start --ini /opt/nautobot/uwsgi.ini
          {{- else }}
          command:
            - nautobot-server
          args:
            - start
            - --ini
            - /opt/nautobot/uwsgi.ini
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
          {{- if .Values.web.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.web.livenessProbe.httpGet.path }}
              port: {{ .Values.web.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.web.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.web.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.web.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.web.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.web.readinessProbe.httpGet.path }}
              port: {{ .Values.web.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.web.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.web.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.web.readinessProbe.failureThreshold }}
          {{- end }}
          env:
            {{- include "nautobot.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /opt/nautobot/nautobot_config.py
              subPath: nautobot_config.py
            - name: media
              mountPath: /opt/nautobot/media
            - name: git
              mountPath: /opt/nautobot/git
            - name: plugins
              mountPath: /opt/python-packages
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: plugins
          emptyDir: {}
        - name: config
          configMap:
            name: nautobot-config
        - name: media
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: nautobot-media
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: git
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: nautobot-git
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
