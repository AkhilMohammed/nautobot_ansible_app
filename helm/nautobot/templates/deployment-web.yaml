apiVersion: apps/v1
kind: Deployment
metadata:
  name: nautobot-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nautobot.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "nautobot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "nautobot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "nautobot.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.initContainers.enabled }}
      initContainers:
        - name: nautobot-migrations
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              echo "Running database migrations..."
              nautobot-server migrate --no-input
              echo "Collecting static files..."
              nautobot-server collectstatic --no-input --clear
              echo "Migrations complete!"
          env:
            {{- include "nautobot.env" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /opt/nautobot/nautobot_config.py
              subPath: nautobot_config.py
            - name: media
              mountPath: /opt/nautobot/media
            - name: static
              mountPath: /opt/nautobot/static
          resources:
            {{- toYaml .Values.initContainers.migrations.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: nautobot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["nautobot-server", "start", "--insecure"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- include "nautobot.env" . | nindent 12 }}
          {{- if .Values.web.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.web.livenessProbe.httpGet.path }}
              port: {{ .Values.web.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.web.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.web.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.web.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.web.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.web.readinessProbe.httpGet.path }}
              port: {{ .Values.web.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.web.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.web.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.web.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /opt/nautobot/nautobot_config.py
              subPath: nautobot_config.py
            - name: media
              mountPath: /opt/nautobot/media
            - name: static
              mountPath: /opt/nautobot/static
            - name: git
              mountPath: /opt/nautobot/git
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: nautobot-config
        - name: media
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: nautobot-media
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: static
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: nautobot-static
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: git
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: nautobot-git
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
