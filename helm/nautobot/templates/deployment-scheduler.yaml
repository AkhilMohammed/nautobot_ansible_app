apiVersion: apps/v1
kind: Deployment
metadata:
  name: nautobot-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nautobot.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nautobot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "nautobot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "nautobot.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: nautobot-scheduler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.nautobot.plugins.enabled }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "==> Installing Git plugins at runtime..."
              if ! command -v git >/dev/null 2>&1; then
                echo "Installing git..."
                apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1 || true
              fi
              {{- range .Values.nautobot.plugins.packages }}
              echo "Installing: {{ .name }}"
              pip install --no-cache-dir {{ .name }} || (echo "ERROR: Failed to install {{ .name }}" && exit 1)
              {{- end }}
              echo "==> ✓ All plugins installed successfully!"
              
              echo "==> Configuring plugins (creating writable copy)..."
              cp /opt/nautobot/nautobot_config.py /tmp/nautobot_config.py
              cat >> /tmp/nautobot_config.py << 'PLUGIN_EOF'
              
              # Plugins - Dynamically configured after runtime installation
              PLUGINS = [
              {{- range .Values.nautobot.plugins.packages }}
                  "{{ .module }}",
              {{- end }}
              ]
              
              PLUGINS_CONFIG = {{ .Values.nautobot.plugins.config | toJson }}
              PLUGIN_EOF
              
              export NAUTOBOT_CONFIG=/tmp/nautobot_config.py
              echo "==> ✓ Plugins configured!"
              echo "==> Starting Celery beat..."
              exec nautobot-server celery beat -l {{ .Values.nautobot.logLevel }}
          {{- else }}
          command:
            - nautobot-server
          args:
            - celery
            - beat
            - -l
            - {{ .Values.nautobot.logLevel }}
          {{- end }}
          env:
            {{- include "nautobot.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /opt/nautobot/nautobot_config.py
              subPath: nautobot_config.py
            - name: media
              mountPath: /opt/nautobot/media
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: plugins
          emptyDir: {}
        - name: config
          configMap:
            name: nautobot-config
        - name: media
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: nautobot-media
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.scheduler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
