apiVersion: apps/v1
kind: Deployment
metadata:
  name: nautobot-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nautobot.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nautobot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "nautobot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "nautobot.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: nautobot-scheduler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["nautobot-server", "celery", "beat", "-l", "{{ .Values.nautobot.logLevel }}"]
          env:
            {{- include "nautobot.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /opt/nautobot/nautobot_config.py
              subPath: nautobot_config.py
            - name: media
              mountPath: /opt/nautobot/media
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: nautobot-config
        - name: media
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: nautobot-media
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.scheduler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
