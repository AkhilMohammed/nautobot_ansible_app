---
# On-Premises Kubernetes Inventory
# This inventory assumes you have a K8s cluster set up on your VMs

all:
  children:
    # Kubernetes Control Plane
    k8s_control_plane:
      hosts:
        onprem-k8s-master:
          ansible_host: 192.168.1.10  # REPLACE with your K8s master node IP
          ansible_user: your_username  # REPLACE with your SSH username
          ansible_ssh_pass: "{{ vault_ssh_password }}"
          deploy_env: onprem
          deployment_type: k8s
          kubeconfig_path: "/home/your_username/.kube/config"  # REPLACE with actual path

    # Kubernetes Worker Nodes (for the cluster itself)
    k8s_workers:
      hosts:
        onprem-k8s-worker-01:
          ansible_host: 192.168.1.11  # REPLACE with worker node IP
          ansible_user: your_username
          ansible_ssh_pass: "{{ vault_ssh_password }}"
        onprem-k8s-worker-02:
          ansible_host: 192.168.1.12  # REPLACE with worker node IP
          ansible_user: your_username
          ansible_ssh_pass: "{{ vault_ssh_password }}"
        onprem-k8s-worker-03:
          ansible_host: 192.168.1.13  # REPLACE with worker node IP
          ansible_user: your_username
          ansible_ssh_pass: "{{ vault_ssh_password }}"
        onprem-k8s-worker-04:
          ansible_host: 192.168.1.14  # REPLACE with worker node IP
          ansible_user: your_username
          ansible_ssh_pass: "{{ vault_ssh_password }}"

    # Database VM (outside K8s)
    postgres:
      hosts:
        onprem-postgres-01:
          ansible_host: 192.168.1.16  # PostgreSQL VM
          ansible_user: your_username
          ansible_ssh_pass: "{{ vault_ssh_password }}"
          deploy_env: onprem

    # Redis VM (outside K8s)
    redis:
      hosts:
        onprem-redis-01:
          ansible_host: 192.168.1.17  # Redis VM
          ansible_user: your_username
          ansible_ssh_pass: "{{ vault_ssh_password }}"
          deploy_env: onprem

    # GitHub Actions Runner
    github_runner:
      hosts:
        onprem-runner-01:
          ansible_host: 192.168.1.18  # CI/CD Runner
          ansible_user: your_username
          ansible_ssh_pass: "{{ vault_ssh_password }}"
          deploy_env: onprem

    # Group for K8s deployment (master where kubectl commands run)
    onprem_k8s:
      hosts:
        onprem-k8s-master:
      vars:
        environment: onprem
        kubeconfig_path: "/home/your_username/.kube/config"

  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
