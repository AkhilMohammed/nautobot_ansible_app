---
# Production-Ready On-Premises Kubernetes Inventory
# 8 VMs: 1 Master (LB), 4 Workers, 1 DB, 1 Redis, 1 Runner

all:
  children:
    # Kubernetes Control Plane (Master + Load Balancer)
    k8s_control_plane:
      hosts:
        onprem-k8s-master:
          ansible_host: 172.17.152.109  # REPLACE - Master & Ingress LoadBalancer
          ansible_user: ubuntu  # REPLACE with your SSH username
          deploy_env: onprem
          deployment_type: k8s
          kubeconfig_path: "/home/ubuntu/.kube/config"
          node_role: master
          install_ingress: true  # Master will run Nginx Ingress Controller

    # Kubernetes Worker Nodes
    k8s_workers:
      hosts:
        # Web Nodes - Will run Nautobot web pods
        onprem-k8s-web-01:
          ansible_host: 172.17.152.103  # REPLACE - Web worker node
          ansible_user: ubuntu
          node_role: web
          node_labels:
            workload: web
        onprem-k8s-web-02:
          ansible_host: 172.17.152.104  # REPLACE - Web worker node
          ansible_user: ubuntu
          node_role: web
          node_labels:
            workload: web
        
        # Celery Worker Nodes - Will run Nautobot celery worker pods
        onprem-k8s-worker-01:
          ansible_host: 172.17.152.105  # REPLACE - Celery worker node
          ansible_user: ubuntu
          node_role: worker
          node_labels:
            workload: worker
        onprem-k8s-worker-02:
          ansible_host: 172.17.152.106  # REPLACE - Celery worker node
          ansible_user: ubuntu
          node_role: worker
          node_labels:
            workload: worker

    # Database VM (outside K8s)
    postgres:
      hosts:
        onprem-postgres-01:
          ansible_host: 172.17.152.107  # PostgreSQL VM
          ansible_user: ubuntu
          deploy_env: onprem

    # Redis VM (outside K8s)
    redis:
      hosts:
        onprem-redis-01:
          ansible_host: 172.17.152.108  # Redis VM
          ansible_user: ubuntu
          deploy_env: onprem

    # GitHub Actions Runner
    github_runner:
      hosts:
        onprem-runner-01:
          ansible_host: 172.17.152.102  # CI/CD Runner
          ansible_user: ubuntu
          deploy_env: onprem

    # Group for K8s deployment (master where kubectl commands run)
    onprem_k8s:
      hosts:
        onprem-k8s-master:
      vars:
        deploy_env: onprem
        kubeconfig_path: "/home/ubuntu/.kube/config"

  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    ansible_ssh_private_key_file: "~/.ssh/ansible-ci"
