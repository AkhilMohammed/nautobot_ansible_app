---
# Production-Ready Kubernetes Nautobot Deployment with Helm
# Fully automated: Installs K8s, Helm, Ingress, and deploys Nautobot
# Usage: ansible-playbook -i inventory/k8s/onprem.yml playbooks/deploy_k8s_production.yml --ask-vault-pass
# Force cleanup: ansible-playbook ... -e force_cleanup=true

- name: BULLETPROOF MODE - Pre-flight auto-recovery
  hosts: k8s_control_plane,k8s_workers
  become: true
  gather_facts: true
  ignore_errors: yes
  vars_files:
    - "../group_vars/onprem/nautobot.yml"

  tasks:
    - name: Detect clock skew and configure APT accordingly
      block:
        - name: Force APT to ignore time validation on all nodes
          ansible.builtin.copy:
            content: |
              Acquire::Check-Valid-Until "false";
              Acquire::Retries "10";
              APT::Acquire::Retries "10";
            dest: /etc/apt/apt.conf.d/99-ignore-time-check
            mode: '0644'
          
        - name: Configure APT for reliability
          ansible.builtin.copy:
            content: |
              APT::Get::Assume-Yes "true";
              APT::Install-Recommends "0";
              APT::Install-Suggests "0";
            dest: /etc/apt/apt.conf.d/99-reliability
            mode: '0644'
          
        - name: Attempt time sync (best effort)
          ansible.builtin.shell: |
            timedatectl set-ntp true 2>/dev/null || true
            systemctl restart chrony 2>/dev/null || true
            chronyc -a makestep 2>/dev/null || true
          ignore_errors: yes
          changed_when: false

        - name: Initial apt-get update with aggressive retries
          ansible.builtin.apt:
            update_cache: yes
            cache_valid_time: 0
          register: initial_apt
          until: initial_apt is success
          retries: 10
          delay: 15
          ignore_errors: yes

    - name: Auto-recover from previous failed deployments
      block:
        - name: Check for stuck processes
          ansible.builtin.shell: |
            pkill -9 kubelet 2>/dev/null || true
            pkill -9 containerd-shim 2>/dev/null || true
            sleep 2
          ignore_errors: yes
          changed_when: false
          
        - name: Clean stale mounts
          ansible.builtin.shell: |
            for mount in $(mount | grep '/var/lib/kubelet' | awk '{print $3}' | sort -r); do
              umount -f "$mount" 2>/dev/null || true
            done
          ignore_errors: yes
          changed_when: false

        - name: Ensure containerd is running
          ansible.builtin.systemd:
            name: containerd
            state: started
            enabled: yes
          ignore_errors: yes
          when: ansible_facts.services['containerd.service'] is defined

- name: Check if cleanup is needed
  hosts: k8s_control_plane,k8s_workers
  become: true
  gather_facts: false
  vars_files:
    - "../group_vars/onprem/nautobot.yml"

  tasks:
    - name: Check if Kubernetes is already running healthy
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf_exists

    - name: Check if kubelet is running
      ansible.builtin.systemd:
        name: kubelet
      register: kubelet_status
      ignore_errors: yes

    - name: Determine if cleanup is needed
      ansible.builtin.set_fact:
        needs_cleanup: "{{ force_cleanup | default(false) | bool or (kubelet_conf_exists.stat.exists and kubelet_status.status.ActiveState != 'active') }}"

    - name: Display cleanup decision
      ansible.builtin.debug:
        msg:
          - "Cleanup decision: {{ 'YES - will cleanup' if needs_cleanup else 'NO - cluster appears healthy, skipping cleanup' }}"
          - "Force cleanup flag: {{ force_cleanup | default('not set') }}"
          - "kubelet.conf exists: {{ kubelet_conf_exists.stat.exists }}"
          - "kubelet status: {{ kubelet_status.status.ActiveState if kubelet_status.status is defined else 'not running' }}"

- name: COMPLETE SYSTEM CLEANUP - Only when needed
  hosts: k8s_control_plane,k8s_workers
  become: true
  gather_facts: false
  vars_files:
    - "../group_vars/onprem/nautobot.yml"

  tasks:
    - name: Display cleanup start
      ansible.builtin.debug:
        msg: "🧹 Starting complete system cleanup for pristine deployment..."
      when: needs_cleanup | default(false) | bool

    - name: Stop kubelet service
      ansible.builtin.systemd:
        name: kubelet
        state: stopped
      ignore_errors: yes
      when: needs_cleanup | default(false) | bool

    - name: Stop containerd service
      ansible.builtin.systemd:
        name: containerd
        state: stopped
      ignore_errors: yes
      when: needs_cleanup | default(false) | bool

    - name: Kill all Kubernetes and container processes
      ansible.builtin.shell: |
        pkill -9 kubelet || true
        pkill -9 kube-proxy || true
        pkill -9 kube-apiserver || true
        pkill -9 kube-controller || true
        pkill -9 kube-scheduler || true
        pkill -9 etcd || true
        pkill -9 containerd || true
        pkill -9 containerd-shim || true
        fuser -k 6443/tcp || true
        fuser -k 10250/tcp || true
        fuser -k 10251/tcp || true
        fuser -k 10252/tcp || true
        fuser -k 2379/tcp || true
        fuser -k 2380/tcp || true
        sleep 3
      ignore_errors: yes
      when: needs_cleanup | default(false) | bool

    - name: Unmask kubelet if masked
      ansible.builtin.systemd:
        name: kubelet
        masked: no
      ignore_errors: yes
      when: needs_cleanup | default(false) | bool

    - name: Disable kubelet service
      ansible.builtin.systemd:
        name: kubelet
        enabled: no
      ignore_errors: yes
      when: needs_cleanup | default(false) | bool

    - name: Reset Kubernetes with kubeadm
      ansible.builtin.command: kubeadm reset -f --cleanup-tmp-dir
      register: kubeadm_reset
      ignore_errors: yes
      changed_when: false
      when: needs_cleanup | default(false) | bool

    - name: Unmount all kubelet and containerd mounts
      ansible.builtin.shell: |
        for mount in $(mount | grep -E 'kubelet|containerd|kubernetes' | awk '{print $3}' | sort -r); do
          umount -f "$mount" 2>/dev/null || true
        done
        sleep 2
      ignore_errors: yes
      when: needs_cleanup | default(false) | bool

    - name: Remove ALL Kubernetes directories and files
      ansible.builtin.shell: |
        rm -rf /etc/kubernetes
        rm -rf /var/lib/kubelet
        rm -rf /var/lib/etcd
        rm -rf /var/lib/containerd
        rm -rf /etc/cni/net.d
        rm -rf /var/lib/calico
        rm -rf /var/lib/cni
        rm -rf /opt/cni
        rm -rf /run/flannel
        rm -rf /var/run/calico
        rm -rf /var/run/kubernetes
        rm -rf ~/.kube
        rm -rf /root/.kube
        rm -rf /tmp/kubeadm-*
        rm -rf /tmp/kube*
      ignore_errors: yes
      when: needs_cleanup | default(false) | bool

    - name: Remove CNI network interfaces
      ansible.builtin.shell: |
        ip link delete cni0 2>/dev/null || true
        ip link delete flannel.1 2>/dev/null || true
        ip link delete tunl0 2>/dev/null || true
        ip link delete vxlan.calico 2>/dev/null || true
        for iface in $(ip link | grep -E 'veth|cali' | awk -F: '{print $2}' | tr -d ' '); do
          ip link delete $iface 2>/dev/null || true
        done
      ignore_errors: yes
      when: needs_cleanup | default(false) | bool

    - name: Flush iptables rules
      ansible.builtin.shell: |
        iptables -F
        iptables -t nat -F
        iptables -t mangle -F
        iptables -X
      ignore_errors: yes
      when: needs_cleanup | default(false) | bool

    - name: Clean containerd data
      ansible.builtin.shell: |
        rm -rf /var/lib/containerd/*
        rm -rf /run/containerd/*
      ignore_errors: yes
      when: needs_cleanup | default(false) | bool

    - name: Restart containerd for clean state
      ansible.builtin.systemd:
        name: containerd
        state: restarted
      ignore_errors: yes
      when: needs_cleanup | default(false) | bool

    - name: Wait for containerd to stabilize
      ansible.builtin.pause:
        seconds: 5
      when: needs_cleanup | default(false) | bool

    - name: Verify cleanup - check critical directories removed
      ansible.builtin.stat:
        path: "{{ item }}"
      register: cleanup_verification
      loop:
        - /etc/kubernetes
        - /var/lib/kubelet
        - /var/lib/etcd
      ignore_errors: yes
      when: needs_cleanup | default(false) | bool

    - name: Display cleanup results
      ansible.builtin.debug:
        msg: "✅ System cleanup complete - all nodes ready for fresh deployment"
      when: needs_cleanup | default(false) | bool

    - name: Display skip message
      ansible.builtin.debug:
        msg: "⏭️  Skipping cleanup - cluster appears healthy and force_cleanup not set"
      when: not (needs_cleanup | default(false) | bool)

- name: Pre-flight Validation - System Requirements Check
  hosts: k8s_control_plane,k8s_workers
  become: true
  gather_facts: true
  vars_files:
    - "../group_vars/onprem/nautobot.yml"
    - "../group_vars/onprem/vault.yml"

  tasks:
    - name: Check minimum CPU cores (2 required)
      ansible.builtin.assert:
        that:
          - ansible_processor_vcpus >= 2
        fail_msg: "Insufficient CPU cores: {{ ansible_processor_vcpus }}. Minimum 2 cores required."
        success_msg: "CPU check passed: {{ ansible_processor_vcpus }} cores available"

    - name: Check minimum memory (2GB required)
      ansible.builtin.assert:
        that:
          - ansible_memtotal_mb >= 1800
        fail_msg: "Insufficient memory: {{ ansible_memtotal_mb }}MB. Minimum 2GB required."
        success_msg: "Memory check passed: {{ ansible_memtotal_mb }}MB available"

    - name: Check disk space in root partition (10GB required)
      ansible.builtin.shell: df -BG / | tail -1 | awk '{print $4}' | sed 's/G//'
      register: disk_space
      changed_when: false
      failed_when: disk_space.stdout | int < 10

    - name: Verify network connectivity to master node
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['k8s_control_plane'][0]].ansible_host }}"
        port: 22
        timeout: 10
        state: started
      when: inventory_hostname in groups['k8s_workers']

    - name: Check if swap is disabled
      ansible.builtin.shell: swapon --show
      register: swap_check
      changed_when: false
      failed_when: false

    - name: Display swap warning if enabled
      ansible.builtin.debug:
        msg: "WARNING: Swap is enabled. Kubernetes requires swap to be disabled."
      when: swap_check.stdout != ""

    - name: Pre-flight validation summary
      ansible.builtin.debug:
        msg:
          - "✅ Pre-flight validation completed successfully"
          - "   - CPU: {{ ansible_processor_vcpus }} cores"
          - "   - Memory: {{ ansible_memtotal_mb }}MB"
          - "   - Disk: {{ disk_space.stdout }}GB available"
          - "   - Network: Connectivity verified"

- name: Prepare all Kubernetes nodes
  hosts: k8s_control_plane,k8s_workers
  become: true
  gather_facts: true
  vars_files:
    - "../group_vars/onprem/nautobot.yml"
    - "../group_vars/onprem/vault.yml"

  tasks:
    - name: Set hostname for each node
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
        use: systemd

    - name: Update /etc/hosts with all cluster nodes
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item].ansible_host }} {{ item }}"
        state: present
      loop: "{{ groups['k8s_control_plane'] + groups['k8s_workers'] }}"

    - name: Force immediate time synchronization
      ansible.builtin.shell: |
        timedatectl set-ntp false
        sleep 2
        timedatectl set-ntp true
        systemctl restart chrony
        sleep 3
        chronyc -a 'burst 4/4'
        sleep 5
        chronyc -a makestep
        sleep 3
      ignore_errors: yes

    - name: Verify current time
      ansible.builtin.command: date
      register: current_time
      changed_when: false

    - name: Display synchronized time
      ansible.builtin.debug:
        msg: "Current system time: {{ current_time.stdout }}"

    - name: Configure APT to ignore time validation (system clock issue workaround)
      ansible.builtin.copy:
        content: |
          Acquire::Check-Valid-Until "false";
        dest: /etc/apt/apt.conf.d/99-ignore-time-check
        mode: '0644'

    - name: Update apt cache (ignoring time validation)
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 0
      register: apt_update
      until: apt_update is success
      retries: 3
      delay: 10

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
          - net-tools
          - vim
          - chrony
        state: present

    - name: Enable systemd time synchronization
      ansible.builtin.command: timedatectl set-ntp true
      changed_when: false
      ignore_errors: yes

    - name: Restart chrony service to force immediate sync
      ansible.builtin.service:
        name: chrony
        state: restarted
        enabled: yes

    - name: Force aggressive time sync with chrony burst mode
      ansible.builtin.shell: |
        chronyc -a 'burst 4/4'
        sleep 2
        chronyc -a makestep
      changed_when: false
      ignore_errors: yes

    - name: Wait for time sync to stabilize
      ansible.builtin.pause:
        seconds: 5

    - name: Verify time is synchronized
      ansible.builtin.command: timedatectl status
      register: time_status
      changed_when: false

    - name: Check if system clock is reasonable (compare with chrony tracking)
      ansible.builtin.shell: |
        # Get system offset from chrony
        OFFSET=$(chronyc -n tracking | grep "System time" | awk '{print $4}')
        # If offset is greater than 1 second, fail
        if [ -n "$OFFSET" ]; then
          ABS_OFFSET=$(echo "$OFFSET" | tr -d '-')
          COMPARE=$(echo "$ABS_OFFSET > 1.0" | bc -l 2>/dev/null || echo "0")
          if [ "$COMPARE" = "1" ]; then
            echo "ERROR: Clock offset is ${OFFSET} seconds - too high"
            exit 1
          fi
        fi
        echo "Clock offset is acceptable: ${OFFSET} seconds"
      register: clock_check
      changed_when: false
      failed_when: false

    - name: Force additional time sync if clock is still off
      ansible.builtin.shell: |
        chronyc -a 'burst 4/4'
        sleep 3
        chronyc -a makestep
        sleep 2
      when: clock_check.rc != 0
      changed_when: false

    - name: Ensure chrony is running and will stay running
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: yes

    - name: Display time sync status
      ansible.builtin.debug:
        var: time_status.stdout_lines

    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Remove swap from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^[^#].*swap.*'
        state: absent

    - name: Create modules-load.d directory
      ansible.builtin.file:
        path: /etc/modules-load.d
        state: directory
        mode: '0755'

    - name: Load required kernel modules
      ansible.builtin.copy:
        content: |
          overlay
          br_netfilter
        dest: /etc/modules-load.d/k8s.conf
        mode: '0644'

    - name: Load modules immediately
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Configure sysctl for Kubernetes
      ansible.builtin.copy:
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        dest: /etc/sysctl.d/k8s.conf
        mode: '0644'

    - name: Apply sysctl settings
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Install containerd
      ansible.builtin.apt:
        name:
          - containerd
        state: present

    - name: Create containerd config directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Generate default containerd config
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Configure containerd to use systemd cgroup
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^\s*SystemdCgroup\s*='
        line: '            SystemdCgroup = true'
        state: present

    - name: Restart and enable containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: yes
        daemon_reload: yes

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Kubernetes apt signing key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key
        dest: /tmp/kubernetes-release.key
        mode: '0644'

    - name: Add Kubernetes apt signing key
      ansible.builtin.shell: |
        gpg --dearmor < /tmp/kubernetes-release.key > /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /"
        filename: kubernetes
        state: present

    - name: Ensure APT ignores time validation before K8s install
      ansible.builtin.copy:
        content: |
          Acquire::Check-Valid-Until "false";
        dest: /etc/apt/apt.conf.d/99-ignore-time-check
        mode: '0644'

    - name: Install Kubernetes components
      ansible.builtin.apt:
        name:
          - kubelet=1.28.*
          - kubeadm=1.28.*
          - kubectl=1.28.*
        state: present
        update_cache: yes
      register: k8s_install
      until: k8s_install is success
      retries: 5
      delay: 30

    - name: Hold Kubernetes packages from auto-upgrade
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet service
      ansible.builtin.systemd:
        name: kubelet
        enabled: yes

- name: Initialize Kubernetes Master Node
  hosts: k8s_control_plane
  become: true
  gather_facts: true
  vars_files:
    - "../group_vars/onprem/nautobot.yml"
    - "../group_vars/onprem/vault.yml"

  tasks:
    - name: Check if Kubernetes is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_initialized

    - name: FORCE RESET - Clean slate for troubled cluster
      ansible.builtin.set_fact:
        force_cluster_reset: true

    - name: Display force reset decision
      ansible.builtin.debug:
        msg: "FORCING FULL CLUSTER RESET to eliminate corruption from previous failed deployments"

    - name: Reset Kubernetes cluster (forced for clean deployment)
      ansible.builtin.command: kubeadm reset -f
      when: k8s_initialized.stat.exists
      register: kubeadm_reset_output

    - name: CRITICAL - Always remove etcd data to prevent corruption
      ansible.builtin.file:
        path: /var/lib/etcd
        state: absent
      register: etcd_cleanup

    - name: Remove other Kubernetes state files after reset
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/kubernetes
        - /var/lib/kubelet
        - ~/.kube
        - /root/.kube
      when:
        - kubeadm_reset_output is defined
        - kubeadm_reset_output is changed

    - name: Re-check if Kubernetes is initialized after reset
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_initialized

    - name: Initialize Kubernetes cluster (with auto-retry on failure)
      ansible.builtin.command: >
        kubeadm init
        --pod-network-cidr=192.168.0.0/16
        --service-cidr=10.96.0.0/12
        --apiserver-advertise-address={{ ansible_host }}
        --control-plane-endpoint={{ ansible_host }}:6443
      when: not k8s_initialized.stat.exists
      register: kubeadm_init_output
      until: kubeadm_init_output.rc == 0
      retries: 3
      delay: 30
      ignore_errors: no

    - name: Create .kube directory for ansible user
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy kubeconfig to ansible user
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Create .kube directory for root
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: '0755'

    - name: Copy kubeconfig to root
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        mode: '0600'

    - name: Wait for API server to be ready
      ansible.builtin.wait_for:
        host: 172.17.152.109
        port: 6443
        delay: 5
        timeout: 120
        state: started

    - name: "CRITICAL: Extended API server stabilization wait"
      ansible.builtin.pause:
        seconds: 60
        prompt: "Waiting 60 seconds for API server to fully stabilize before proceeding..."

    - name: Verify API server is responding to requests
      ansible.builtin.shell: |
        for i in {1..10}; do
          if kubectl cluster-info 2>&1 | grep -q "Kubernetes control plane"; then
            echo "API_READY"
            exit 0
          fi
          sleep 5
        done
        echo "API_NOT_READY"
        exit 1
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: api_health
      retries: 3
      delay: 10

    - name: Wait for etcd to be healthy
      ansible.builtin.shell: |
        kubectl get pods -n kube-system -l component=etcd -o jsonpath='{.items[0].status.phase}'
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: etcd_status
      until: etcd_status.stdout == "Running"
      retries: 20
      delay: 5
      changed_when: false
      failed_when: false

    - name: Verify etcd container is actually running
      ansible.builtin.shell: |
        crictl --runtime-endpoint unix:///run/containerd/containerd.sock ps | grep etcd | grep Running
      register: etcd_container
      until: etcd_container.rc == 0
      retries: 15
      delay: 5
      changed_when: false

    - name: Wait for all control plane pods to be running
      ansible.builtin.shell: |
        kubectl get pods -n kube-system -l tier=control-plane -o jsonpath='{.items[*].status.phase}' | grep -v -q "Pending\|Failed\|Unknown" && echo "Ready"
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: control_plane_status
      until: control_plane_status.stdout == "Ready"
      retries: 20
      delay: 5
      changed_when: false
      failed_when: false

    - name: Wait for kubectl to be responsive
      ansible.builtin.command: kubectl cluster-info
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: cluster_info
      until: cluster_info.rc == 0
      retries: 15
      delay: 10
      changed_when: false

    - name: "CRITICAL: Check memory availability before Calico"
      ansible.builtin.shell: |
        free -m | awk 'NR==2{printf "Memory: %s/%sMB (%.2f%%)\n", $3,$2,$3*100/$2 }'
        available=$(free -m | awk 'NR==2{print $7}')
        if [ $available -lt 500 ]; then
          echo "WARNING: Low memory available: ${available}MB"
          exit 1
        fi
        echo "Memory check passed: ${available}MB available"
      register: memory_check
      failed_when: false
      changed_when: false

    - name: Display memory status
      ansible.builtin.debug:
        msg: "{{ memory_check.stdout_lines }}"

    - name: "CRITICAL: Final control plane health check before Calico"
      ansible.builtin.shell: |
        # Check all control plane pods
        APISERVER=$(kubectl get pods -n kube-system -l component=kube-apiserver -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "NotFound")
        SCHEDULER=$(kubectl get pods -n kube-system -l component=kube-scheduler -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "NotFound")
        CONTROLLER=$(kubectl get pods -n kube-system -l component=kube-controller-manager -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "NotFound")
        ETCD=$(kubectl get pods -n kube-system -l component=etcd -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "NotFound")
        
        echo "API Server: $APISERVER"
        echo "Scheduler: $SCHEDULER"  
        echo "Controller Manager: $CONTROLLER"
        echo "etcd: $ETCD"
        
        if [ "$APISERVER" != "Running" ] || [ "$SCHEDULER" != "Running" ] || [ "$CONTROLLER" != "Running" ] || [ "$ETCD" != "Running" ]; then
          echo "ERROR: Control plane not fully healthy"
          exit 1
        fi
        echo "Control plane health check PASSED"
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: control_plane_health
      retries: 5
      delay: 15

    - name: Display control plane health
      ansible.builtin.debug:
        msg: "{{ control_plane_health.stdout_lines }}"

    - name: Check if Calico CNI is installed
      ansible.builtin.command: kubectl get daemonset calico-node -n kube-system
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: calico_check
      failed_when: false
      changed_when: false

    - name: Install Calico CNI network plugin (replaces Flannel)
      ansible.builtin.command: >
        kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.0/manifests/calico.yaml
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      when: calico_check.rc != 0

    - name: Check if Calico DaemonSet has stuck/corrupted pods
      ansible.builtin.shell: |
        DESIRED=$(kubectl get daemonset calico-node -n kube-system -o jsonpath='{.status.desiredNumberScheduled}' 2>/dev/null || echo "0")
        READY=$(kubectl get daemonset calico-node -n kube-system -o jsonpath='{.status.numberReady}' 2>/dev/null || echo "0")
        if [ "$DESIRED" -gt "0" ] && [ "$READY" -eq "0" ]; then
          # Pods exist but none are ready - likely stuck from previous deployment
          echo "STUCK"
        else
          echo "OK"
        fi
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: calico_stuck_check
      changed_when: false
      failed_when: false

    - name: Display Calico status
      ansible.builtin.debug:
        msg: "Calico DaemonSet status: {{ calico_stuck_check.stdout }} (pods may be stuck from previous failed deployment)"

    - name: Delete stuck Calico resources to force clean restart
      ansible.builtin.shell: |
        kubectl delete daemonset calico-node -n kube-system --ignore-not-found=true
        kubectl delete pods -n kube-system -l k8s-app=calico-node --ignore-not-found=true
        sleep 5
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      when: calico_stuck_check.stdout == "STUCK"

    - name: Reinstall Calico after cleanup
      ansible.builtin.shell: |
        kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.0/manifests/calico.yaml
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      when: calico_stuck_check.stdout == "STUCK"

    - name: Wait 180 seconds for API server to fully stabilize after all worker joins
      ansible.builtin.pause:
        seconds: 180
        prompt: "Waiting 180 seconds for API server to stabilize after all worker joins..."

    - name: Check if API server is responsive
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 6443
        timeout: 60
        state: started
      register: api_port_check
      failed_when: false

    - name: Verify API server health after worker joins
      ansible.builtin.command: kubectl get --raw /healthz
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: api_health_post_join
      retries: 10
      delay: 10
      until: api_health_post_join.rc == 0
      changed_when: false
      failed_when: false

    - name: If API server crashed, check control plane pod status
      block:
        - name: Check kube-apiserver pod status
          ansible.builtin.command: crictl pods --name kube-apiserver
          register: apiserver_pod_status
          changed_when: false

        - name: Check etcd pod status  
          ansible.builtin.command: crictl pods --name etcd
          register: etcd_pod_status
          changed_when: false

        - name: Get API server logs
          ansible.builtin.shell: crictl logs $(crictl ps --name kube-apiserver -q) 2>&1 | tail -50
          register: apiserver_logs
          changed_when: false
          failed_when: false

        - name: Display control plane diagnostics
          ansible.builtin.debug:
            msg:
              - "=== API SERVER POD STATUS ==="
              - "{{ apiserver_pod_status.stdout_lines }}"
              - "=== ETCD POD STATUS ==="
              - "{{ etcd_pod_status.stdout_lines }}"
              - "=== API SERVER LOGS (last 50 lines) ==="
              - "{{ apiserver_logs.stdout_lines }}"

        - name: AGGRESSIVE RECOVERY - Stop containerd to reset everything
          ansible.builtin.systemd:
            name: containerd
            state: stopped
          become: true

        - name: Wait for all processes to stop
          ansible.builtin.pause:
            seconds: 10

        - name: AGGRESSIVE RECOVERY - Restart containerd
          ansible.builtin.systemd:
            name: containerd
            state: started
          become: true

        - name: Wait for containerd to initialize
          ansible.builtin.pause:
            seconds: 15

        - name: AGGRESSIVE RECOVERY - Restart kubelet
          ansible.builtin.systemd:
            name: kubelet
            state: restarted
          become: true

        - name: Wait for static pods to restart (critical)
          ansible.builtin.pause:
            seconds: 90
            prompt: "Waiting 90 seconds for etcd and API server static pods to fully restart..."

        - name: Check if static pods are running
          ansible.builtin.command: crictl pods --state Ready
          register: static_pods_running
          retries: 10
          delay: 10
          until: "'kube-apiserver' in static_pods_running.stdout and 'etcd' in static_pods_running.stdout"
          changed_when: false
          failed_when: false

        - name: Wait for API server to come back up
          ansible.builtin.wait_for:
            host: "{{ ansible_host }}"
            port: 6443
            timeout: 180
            state: started

        - name: Verify API server recovered
          ansible.builtin.command: kubectl get --raw /healthz
          become_user: "{{ ansible_user }}"
          environment:
            KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
          register: api_health_recovered
          retries: 20
          delay: 10
          until: api_health_recovered.rc == 0
      when: api_health_post_join.rc != 0 or api_port_check.failed

    - name: Final API health check before Calico verification
      ansible.builtin.command: kubectl get nodes
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: api_health_before_calico
      retries: 10
      delay: 10
      until: api_health_before_calico.rc == 0
      changed_when: false
      failed_when: false

    - name: Emergency recovery if API crashed before Calico check
      block:
        - name: Display API crash detected
          ansible.builtin.debug:
            msg: "API server crashed before Calico check - initiating emergency recovery"

        - name: Check control plane pods
          ansible.builtin.command: crictl pods
          register: all_pods_status
          changed_when: false

        - name: Get API server container logs
          ansible.builtin.shell: crictl logs $(crictl ps --name kube-apiserver -q) 2>&1 | tail -100
          register: apiserver_crash_logs
          changed_when: false
          failed_when: false

        - name: Display crash diagnostics
          ansible.builtin.debug:
            msg:
              - "=== CONTROL PLANE PODS ==="
              - "{{ all_pods_status.stdout_lines }}"
              - "=== API SERVER CRASH LOGS ==="
              - "{{ apiserver_crash_logs.stdout_lines[-30:] }}"

        - name: Restart kubelet to recover crashed control plane
          ansible.builtin.systemd:
            name: kubelet
            state: restarted
          become: true

        - name: Wait 60 seconds for control plane pods to restart
          ansible.builtin.pause:
            seconds: 60

        - name: Wait for API server port to be available
          ansible.builtin.wait_for:
            host: "{{ ansible_host }}"
            port: 6443
            timeout: 180
            state: started

        - name: Verify API server fully recovered
          ansible.builtin.command: kubectl get nodes
          become_user: "{{ ansible_user }}"
          environment:
            KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
          register: api_health_recovered_final
          retries: 15
          delay: 10
          until: api_health_recovered_final.rc == 0
      when: api_health_before_calico.rc != 0

    - name: Calico verification with automatic recovery
      block:
        - name: Wait for Calico DaemonSet to be available
          ansible.builtin.shell: |
            kubectl get daemonset calico-node -n kube-system -o jsonpath='{.status.numberReady}'
          become_user: "{{ ansible_user }}"
          environment:
            KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
          register: calico_ready
          until: calico_ready.stdout | int > 0
          retries: 30
          delay: 10
          changed_when: false

        - name: Verify Calico pods are running on master
          ansible.builtin.shell: |
            kubectl get pods -n kube-system -l k8s-app=calico-node -o wide | grep onprem-k8s-master | grep Running
          become_user: "{{ ansible_user }}"
          environment:
            KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
          register: calico_pod_check
          until: calico_pod_check.rc == 0
          retries: 20
          delay: 5
          changed_when: false
      rescue:
        - name: Calico check failed - attempting API recovery
          ansible.builtin.debug:
            msg: "Calico verification failed - initiating control plane recovery"

        - name: Restart kubelet to recover control plane
          ansible.builtin.systemd:
            name: kubelet
            state: restarted
          become: true

        - name: Wait for control plane recovery
          ansible.builtin.pause:
            seconds: 90
            prompt: "Waiting 90 seconds for full control plane recovery..."

        - name: Verify API server recovered
          ansible.builtin.wait_for:
            host: "{{ ansible_host }}"
            port: 6443
            timeout: 120
            state: started

        - name: Retry Calico DaemonSet check after recovery
          ansible.builtin.shell: |
            # First check if API server is reachable
            if ! kubectl cluster-info 2>&1 | grep -q "Kubernetes control plane"; then
              echo "API server not reachable"
              exit 1
            fi
            # Then check Calico DaemonSet
            kubectl get daemonset calico-node -n kube-system -o jsonpath='{.status.numberReady}'
          become_user: "{{ ansible_user }}"
          environment:
            KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
          register: calico_ready_retry
          until: calico_ready_retry.rc == 0 and (calico_ready_retry.stdout | default('0') | int > 0)
          retries: 20
          delay: 10
          changed_when: false
          failed_when: false

        - name: "Final verification - if Calico still not ready, report and continue"
          ansible.builtin.debug:
            msg: "WARNING: Calico may not be fully ready but continuing deployment. Manual verification required."
          when: calico_ready_retry.rc != 0 or (calico_ready_retry.stdout | default('0') | int == 0)

    - name: Wait for master node to be Ready
      ansible.builtin.command: kubectl get nodes onprem-k8s-master -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: master_ready
      until: master_ready.stdout == "True"
      retries: 30
      delay: 10
      changed_when: false

    - name: Generate join command for workers
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command
      changed_when: false

    - name: Save join command as fact
      ansible.builtin.set_fact:
        k8s_join_command: "{{ join_command.stdout }}"

    - name: Create cluster-info directory for disaster recovery
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/cluster-backup"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0700'

    - name: Save join command to file for disaster recovery
      ansible.builtin.copy:
        content: |
          # Kubernetes Worker Join Command
          # Generated: {{ ansible_date_time.iso8601 }}
          # Master Node: {{ ansible_host }}
          
          {{ join_command.stdout }}
          
          # To join additional worker nodes, run this command as root on the new node
          # Token is valid for 24 hours by default
        dest: "/home/{{ ansible_user }}/cluster-backup/worker-join-command.sh"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Save kubeconfig for disaster recovery
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/cluster-backup/kubeconfig-backup.yaml"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Save cluster configuration summary
      ansible.builtin.copy:
        content: |
          # Kubernetes Cluster Configuration
          # Generated: {{ ansible_date_time.iso8601 }}
          
          Cluster Name: production-k8s
          Master Node: {{ ansible_host }}
          Pod Network CIDR: 10.244.0.0/16
          Service CIDR: 10.96.0.0/12
          CNI: Calico v3.27.0
          Ingress: Nginx (NodePort 30080/30443)
          
          # To restore cluster access from this backup:
          # 1. Copy kubeconfig-backup.yaml to ~/.kube/config
          # 2. Verify: kubectl get nodes
          
          # To add new worker nodes:
          # 1. Run worker-join-command.sh on the new node as root
          # 2. Label the node: kubectl label nodes <node-name> workload=<web|worker>
        dest: "/home/{{ ansible_user }}/cluster-backup/README.txt"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Display cluster backup location
      ansible.builtin.debug:
        msg:
          - "💾 Cluster configuration backed up to: /home/{{ ansible_user }}/cluster-backup/"
          - "   - worker-join-command.sh (for adding nodes)"
          - "   - kubeconfig-backup.yaml (for cluster access)"
          - "   - README.txt (recovery instructions)"

- name: Verify API server health before worker joins
  hosts: k8s_control_plane
  become: true
  gather_facts: false

  tasks:
    - name: Check if API server is responsive
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 6443
        timeout: 10
        state: started
      register: api_check
      failed_when: false

    - name: Check API server pod status
      ansible.builtin.shell: |
        kubectl get pods -n kube-system -l component=kube-apiserver -o jsonpath='{.items[0].status.phase}'
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: apiserver_pod
      failed_when: false
      become: false

    - name: Display API server status
      ansible.builtin.debug:
        msg: 
          - "API server port 6443: {{ 'accessible' if api_check.failed == false else 'NOT accessible' }}"
          - "API server pod status: {{ apiserver_pod.stdout if apiserver_pod.rc == 0 else 'Unable to check' }}"

    - name: Restart kubelet if API server is down
      ansible.builtin.service:
        name: kubelet
        state: restarted
      when: api_check.failed or (apiserver_pod.rc != 0) or (apiserver_pod.stdout != 'Running')

    - name: Wait for API server to be healthy after restart
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 6443
        timeout: 60
        state: started
      retries: 3
      delay: 10
      when: api_check.failed or (apiserver_pod.rc != 0) or (apiserver_pod.stdout != 'Running')

- name: Join worker nodes to cluster
  hosts: k8s_workers
  become: true
  gather_facts: false
  serial: 1

  tasks:
    - name: Ensure chrony is running on worker before join
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: yes

    - name: Force time sync on worker node before joining cluster
      ansible.builtin.shell: |
        timedatectl set-ntp true
        systemctl restart chrony
        sleep 2
        chronyc -a 'burst 4/4'
        sleep 3
        chronyc -a makestep
        sleep 2
      changed_when: false

    - name: Verify worker node time is synchronized
      ansible.builtin.command: timedatectl status
      register: worker_time_status
      changed_when: false

    - name: Display worker time status
      ansible.builtin.debug:
        msg: "Worker node time status: {{ worker_time_status.stdout_lines }}"

    - name: Check if API server is accessible from worker
      ansible.builtin.wait_for:
        host: "{{ groups['k8s_control_plane'][0] }}"
        port: 6443
        timeout: 30
        state: started
      register: api_server_check
      failed_when: false
      ignore_errors: yes

    - name: Display API server accessibility
      ansible.builtin.debug:
        msg: "API server {{ groups['k8s_control_plane'][0] }}:6443 is {{ 'accessible' if api_server_check.failed == false else 'NOT accessible - this may cause issues' }}"

    - name: Check if node is registered in Kubernetes cluster
      ansible.builtin.command: kubectl get node {{ inventory_hostname }} -o name
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"
      become: false
      environment:
        KUBECONFIG: "/home/{{ hostvars[groups['k8s_control_plane'][0]]['ansible_user'] }}/.kube/config"
      register: node_registered
      failed_when: false
      changed_when: false
      when: api_server_check.failed == false

    - name: Display node registration status
      ansible.builtin.debug:
        msg: "Node {{ inventory_hostname }} registration status: {{ 'registered' if (node_registered is defined and node_registered.rc == 0) else 'not registered or API server unavailable' }}"

    - name: FORCE CLEANUP - Mask kubelet to prevent auto-start
      ansible.builtin.systemd:
        name: kubelet
        masked: yes
      ignore_errors: yes

    - name: FORCE CLEANUP - Stop kubelet service
      ansible.builtin.service:
        name: kubelet
        state: stopped
      ignore_errors: yes

    - name: FORCE CLEANUP - Stop containerd to release all locks
      ansible.builtin.service:
        name: containerd
        state: stopped
      ignore_errors: yes

    - name: FORCE CLEANUP - Kill any remaining processes
      ansible.builtin.shell: |
        pkill -9 kubelet || true
        pkill -9 containerd || true
        fuser -k 10250/tcp || true
        sleep 3
      ignore_errors: yes

    - name: FORCE CLEANUP - Unmount all kubelet volumes
      ansible.builtin.shell: |
        for mount in $(mount | grep '/var/lib/kubelet' | awk '{print $3}' | sort -r); do
          umount -f "$mount" 2>/dev/null || true
        done
        for mount in $(mount | grep '/var/lib/containerd' | awk '{print $3}' | sort -r); do
          umount -f "$mount" 2>/dev/null || true
        done
        sleep 2
      ignore_errors: yes

    - name: FORCE CLEANUP - Run kubeadm reset
      ansible.builtin.command: kubeadm reset -f --cleanup-tmp-dir
      register: reset_result
      failed_when: false
      ignore_errors: yes

    - name: FORCE CLEANUP - Remove ALL Kubernetes state
      ansible.builtin.shell: |
        rm -rf /etc/kubernetes
        rm -rf /var/lib/kubelet
        rm -rf /var/lib/etcd
        rm -rf /etc/cni/net.d
        rm -rf /var/lib/calico
        rm -rf /opt/cni
        rm -rf /run/flannel
        rm -rf /var/run/calico
        rm -rf ~/.kube
        rm -rf /root/.kube
      ignore_errors: yes

    - name: FORCE CLEANUP - Restart containerd with clean state
      ansible.builtin.service:
        name: containerd
        state: restarted
      retries: 3
      delay: 5

    - name: Wait for containerd to be fully ready
      ansible.builtin.pause:
        seconds: 5

    - name: Verify cleanup - Check critical files removed
      ansible.builtin.stat:
        path: "{{ item }}"
      register: cleanup_check
      loop:
        - /etc/kubernetes/kubelet.conf
        - /etc/kubernetes/pki/ca.crt
        - /var/lib/kubelet/config.yaml
      failed_when: false

    - name: Display cleanup verification
      ansible.builtin.debug:
        msg: "Cleanup status: {{ 'All clean' if cleanup_check.results | selectattr('stat.exists', 'equalto', true) | list | length == 0 else 'Some files remain but proceeding' }}"

    - name: Wait for API server to be responsive before join
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['k8s_control_plane'][0]]['ansible_host'] }}"
        port: 6443
        timeout: 60
        state: started
      retries: 5
      delay: 10

    - name: Final check - Ensure kubelet is stopped before join
      ansible.builtin.service:
        name: kubelet
        state: stopped
      ignore_errors: yes

    - name: Final check - Verify files still don't exist
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: final_file_check

    - name: Display final state before join
      ansible.builtin.debug:
        msg: "Pre-join status: kubelet=stopped, kubelet.conf={{ 'EXISTS (WARNING!)' if final_file_check.stat.exists else 'removed' }}"

    - name: Verify API server is healthy before join attempt
      ansible.builtin.command: kubectl get nodes
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"
      become: false
      environment:
        KUBECONFIG: "/home/{{ hostvars[groups['k8s_control_plane'][0]]['ansible_user'] }}/.kube/config"
      register: api_health_before_join
      retries: 5
      delay: 5
      until: api_health_before_join.rc == 0
      changed_when: false
      failed_when: false

    - name: Display API server health
      ansible.builtin.debug:
        msg: "API server health: {{ 'HEALTHY' if api_health_before_join.rc == 0 else 'DEGRADED - waiting...' }}"

    - name: Wait additional time if API degraded
      ansible.builtin.pause:
        seconds: 30
      when: api_health_before_join.rc != 0

    - name: Check pending certificate signing requests before join
      ansible.builtin.command: kubectl get csr
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"
      become: false
      environment:
        KUBECONFIG: "/home/{{ hostvars[groups['k8s_control_plane'][0]]['ansible_user'] }}/.kube/config"
      register: csr_before_join
      changed_when: false
      failed_when: false

    - name: Display CSR queue status
      ansible.builtin.debug:
        msg: "Pending CSRs: {{ csr_before_join.stdout_lines | length - 1 }} - {{ 'Queue clear' if (csr_before_join.stdout_lines | length) <= 2 else 'WARNING: Queue backed up' }}"

    - name: CRITICAL - Disable kubelet to prevent auto-start
      ansible.builtin.systemd:
        name: kubelet
        enabled: no
      ignore_errors: yes

    - name: CRITICAL - Unmask kubelet immediately before join
      ansible.builtin.systemd:
        name: kubelet
        masked: no
      ignore_errors: yes

    - name: CRITICAL - Ensure kubelet stays stopped after unmask
      ansible.builtin.service:
        name: kubelet
        state: stopped
      ignore_errors: yes

    - name: CRITICAL - Kill any kubelet that auto-started
      ansible.builtin.shell: |
        pkill -9 kubelet || true
        fuser -k 10250/tcp || true
        sleep 1
      ignore_errors: yes

    - name: Join worker node to cluster with preflight bypass
      ansible.builtin.shell: "{{ hostvars[groups['k8s_control_plane'][0]]['k8s_join_command'] }} --ignore-preflight-errors=FileAvailable--etc-kubernetes-kubelet.conf,FileAvailable--etc-kubernetes-pki-ca.crt,Port-10250"
      register: join_result
      retries: 3
      delay: 20
      until: join_result.rc == 0
      when: (node_registered is not defined) or (node_registered.rc != 0)
      async: 600
      poll: 15

    - name: Display join result
      ansible.builtin.debug:
        msg: "{{ join_result.stdout_lines if join_result is defined and join_result.stdout_lines is defined else 'Node already registered in cluster - skipping join' }}"

    - name: IMMEDIATE - Wait for join process to settle
      ansible.builtin.pause:
        seconds: 60
        prompt: "Worker joined - waiting 60s for processes to settle and API to stabilize..."

    - name: IMMEDIATE - Check if API server survived the join
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['k8s_control_plane'][0]]['ansible_host'] }}"
        port: 6443
        timeout: 20
        state: started
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"
      register: api_port_after_join
      failed_when: false

    - name: IMMEDIATE - API Recovery if crashed during join
      block:
        - name: Display API crash detected
          ansible.builtin.debug:
            msg: "⚠️ API server crashed during worker join - initiating immediate recovery"

        - name: Stop containerd on master for full reset
          ansible.builtin.systemd:
            name: containerd
            state: stopped
          delegate_to: "{{ groups['k8s_control_plane'][0] }}"
          become: true

        - name: Wait for containerd shutdown
          ansible.builtin.pause:
            seconds: 10

        - name: Start containerd on master
          ansible.builtin.systemd:
            name: containerd
            state: started
          delegate_to: "{{ groups['k8s_control_plane'][0] }}"
          become: true

        - name: Wait for containerd initialization
          ansible.builtin.pause:
            seconds: 15

        - name: Restart kubelet on master to restart static pods
          ansible.builtin.systemd:
            name: kubelet
            state: restarted
          delegate_to: "{{ groups['k8s_control_plane'][0] }}"
          become: true

        - name: Wait for static pods to restart (etcd + API server)
          ansible.builtin.pause:
            seconds: 180
            prompt: "Waiting 180 seconds for etcd and API server static pods to fully restart..."

        - name: Verify API server port is back up
          ansible.builtin.wait_for:
            host: "{{ hostvars[groups['k8s_control_plane'][0]]['ansible_host'] }}"
            port: 6443
            timeout: 300
            state: started
          delegate_to: "{{ groups['k8s_control_plane'][0] }}"

        - name: Verify API server is responding to health checks
          ansible.builtin.command: kubectl get --raw /healthz
          delegate_to: "{{ groups['k8s_control_plane'][0] }}"
          become: false
          environment:
            KUBECONFIG: "/home/{{ hostvars[groups['k8s_control_plane'][0]]['ansible_user'] }}/.kube/config"
          register: api_health_recovered
          until: api_health_recovered.rc == 0
          retries: 30
          delay: 10
          changed_when: false

        - name: Display recovery success
          ansible.builtin.debug:
            msg: "✅ API server recovered successfully after worker join"
      when: api_port_after_join.failed or api_port_after_join.elapsed is undefined

    - name: If join failed, capture kubelet and API diagnostics
      block:
        - name: Get kubelet logs on failure
          ansible.builtin.command: journalctl -u kubelet -n 50 --no-pager
          register: kubelet_logs
          changed_when: false

        - name: Get pending CSRs
          ansible.builtin.command: kubectl get csr -o wide
          delegate_to: "{{ groups['k8s_control_plane'][0] }}"
          become: false
          environment:
            KUBECONFIG: "/home/{{ hostvars[groups['k8s_control_plane'][0]]['ansible_user'] }}/.kube/config"
          register: csr_status
          changed_when: false

        - name: Check API server load
          ansible.builtin.command: kubectl top nodes
          delegate_to: "{{ groups['k8s_control_plane'][0] }}"
          become: false
          environment:
            KUBECONFIG: "/home/{{ hostvars[groups['k8s_control_plane'][0]]['ansible_user'] }}/.kube/config"
          register: api_load
          changed_when: false
          failed_when: false

        - name: Display failure diagnostics
          ansible.builtin.debug:
            msg:
              - "=== KUBELET LOGS ==="
              - "{{ kubelet_logs.stdout_lines[-20:] }}"
              - "=== CERTIFICATE SIGNING REQUESTS ==="
              - "{{ csr_status.stdout_lines }}"
              - "=== API SERVER LOAD ==="
              - "{{ api_load.stdout_lines if api_load.rc == 0 else 'Metrics not available' }}"
      when: join_result is defined and join_result.rc != 0

    - name: Wait for kubelet to be active on worker
      ansible.builtin.systemd:
        name: kubelet
        state: started
      register: kubelet_start
      until: kubelet_start.status.ActiveState == "active"
      retries: 10
      delay: 5

    - name: Wait for node to be registered in cluster
      ansible.builtin.command: kubectl get node {{ inventory_hostname }} -o name
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"
      become: false
      environment:
        KUBECONFIG: "/home/{{ hostvars[groups['k8s_control_plane'][0]]['ansible_user'] }}/.kube/config"
      register: node_registered_check
      until: node_registered_check.rc == 0
      retries: 20
      delay: 5
      changed_when: false
      when: (node_registered is not defined) or (node_registered.rc != 0)

    - name: Check API server health before Calico check
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['k8s_control_plane'][0]]['ansible_host'] }}"
        port: 6443
        timeout: 10
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"
      register: api_health_check
      failed_when: false
      ignore_errors: yes

    - name: Restart kubelet on master if API server down
      ansible.builtin.service:
        name: kubelet
        state: restarted
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"
      become: true
      when: api_health_check is defined and api_health_check.failed

    - name: Wait for API server recovery
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['k8s_control_plane'][0]]['ansible_host'] }}"
        port: 6443
        timeout: 60
        delay: 5
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"
      when: api_health_check is defined and api_health_check.failed
      retries: 3
      delay: 10

    - name: Wait for kubelet to register node
      ansible.builtin.pause:
        seconds: 30
        prompt: "Waiting for kubelet to register node {{ inventory_hostname }} in cluster..."

    - name: Quick check - Verify node appears in cluster
      ansible.builtin.command: kubectl get node {{ inventory_hostname }} -o jsonpath='{.metadata.name}'
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"
      become: false
      environment:
        KUBECONFIG: "/home/{{ hostvars[groups['k8s_control_plane'][0]]['ansible_user'] }}/.kube/config"
      register: node_check
      retries: 10
      delay: 5
      until: node_check.stdout == inventory_hostname
      changed_when: false
      failed_when: false

    - name: Display node registration
      ansible.builtin.debug:
        msg: "Node {{ inventory_hostname }}: {{ 'Registered in cluster' if (node_check is defined and node_check.stdout == inventory_hostname) else 'Registration pending' }}"

    - name: CRITICAL - Wait for this worker node to be Ready
      ansible.builtin.command: kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"
      become: false
      environment:
        KUBECONFIG: "/home/{{ hostvars[groups['k8s_control_plane'][0]]['ansible_user'] }}/.kube/config"
      register: node_ready_status
      until: node_ready_status.stdout == "True"
      retries: 40
      delay: 10
      changed_when: false

    - name: Display node ready status
      ansible.builtin.debug:
        msg: "Node {{ inventory_hostname }} is now Ready"

    - name: CRITICAL - Wait for Calico pod to be Running on this worker
      ansible.builtin.shell: |
        kubectl get pods -n kube-system -l k8s-app=calico-node \
          --field-selector spec.nodeName={{ inventory_hostname }} \
          -o jsonpath='{.items[0].status.phase}'
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"
      become: false
      environment:
        KUBECONFIG: "/home/{{ hostvars[groups['k8s_control_plane'][0]]['ansible_user'] }}/.kube/config"
      register: calico_pod_status
      until: calico_pod_status.stdout == "Running"
      retries: 30
      delay: 10
      changed_when: false

    - name: Display Calico status
      ansible.builtin.debug:
        msg: "Calico pod on {{ inventory_hostname }} is Running"

    - name: CRITICAL - Verify all CSRs are approved (not just cleared)
      ansible.builtin.shell: |
        kubectl get csr --no-headers | grep -v Approved || echo "All approved"
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"
      become: false
      environment:
        KUBECONFIG: "/home/{{ hostvars[groups['k8s_control_plane'][0]]['ansible_user'] }}/.kube/config"
      register: unapproved_csrs
      until: unapproved_csrs.stdout == "All approved"
      retries: 20
      delay: 5
      changed_when: false
      failed_when: false

    - name: Display CSR status
      ansible.builtin.debug:
        msg: "All CSRs approved - API server ready for next worker"

    - name: Wait for CSR queue to clear before next worker
      ansible.builtin.command: kubectl get csr --no-headers
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"
      become: false
      environment:
        KUBECONFIG: "/home/{{ hostvars[groups['k8s_control_plane'][0]]['ansible_user'] }}/.kube/config"
      register: csr_queue
      until: (csr_queue.stdout_lines | length) <= 1
      retries: 10
      delay: 5
      changed_when: false
      failed_when: false

    - name: Pause between worker joins to reduce API load
      ansible.builtin.pause:
        seconds: 120
        prompt: "Worker {{ inventory_hostname }} fully operational - pausing 120 seconds before next worker for API stability..."

- name: Verify all workers joined and Calico pods deployed
  hosts: k8s_control_plane
  become: false
  gather_facts: false
  vars_files:
    - "../group_vars/onprem/nautobot.yml"

  tasks:
    - name: Wait for cluster to stabilize after all worker joins
      ansible.builtin.pause:
        seconds: 60
        prompt: "⏸️  Giving cluster 60 seconds to stabilize after all worker joins..."

    - name: Check all nodes are registered
      ansible.builtin.command: kubectl get nodes -o name
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: all_nodes
      changed_when: false

    - name: Display all registered nodes
      ansible.builtin.debug:
        msg: "{{ all_nodes.stdout_lines }}"

    - name: Verify Calico pods are being created
      ansible.builtin.shell: |
        kubectl get pods -n kube-system -l k8s-app=calico-node -o wide
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: calico_pods_status
      changed_when: false
      failed_when: false

    - name: Display Calico pods deployment status
      ansible.builtin.debug:
        msg: "{{ calico_pods_status.stdout_lines }}"

    - name: Wait for all Calico pods to reach Running state
      ansible.builtin.shell: |
        TOTAL=$(kubectl get daemonset calico-node -n kube-system -o jsonpath='{.status.desiredNumberScheduled}')
        READY=$(kubectl get daemonset calico-node -n kube-system -o jsonpath='{.status.numberReady}')
        echo "READY=$READY TOTAL=$TOTAL"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: calico_daemonset_status
      until: calico_daemonset_status.stdout is search('READY=\d+ TOTAL=\d+') and (calico_daemonset_status.stdout.split('READY=')[1].split(' ')[0] == calico_daemonset_status.stdout.split('TOTAL=')[1].split(' ')[0])
      retries: 30
      delay: 10
      changed_when: false
      failed_when: false

    - name: Display final Calico status
      ansible.builtin.debug:
        msg: "Calico DaemonSet status: {{ calico_daemonset_status.stdout }}"

- name: Configure node labels and taints
  hosts: k8s_control_plane
  become: false
  gather_facts: false
  vars_files:
    - "../group_vars/onprem/nautobot.yml"

  tasks:
    - name: Verify API server is still responsive
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 6443
        timeout: 30
        state: started
      register: api_check
      ignore_errors: yes

    - name: Check API server health via kubectl
      ansible.builtin.command: kubectl cluster-info
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: cluster_info
      retries: 5
      delay: 10
      until: cluster_info.rc == 0
      changed_when: false

    - name: Display cluster info
      ansible.builtin.debug:
        msg: "{{ cluster_info.stdout_lines }}"

    - name: Wait for all worker nodes to be registered
      ansible.builtin.command: kubectl get nodes -o name
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: registered_nodes
      until: |
        registered_nodes.stdout_lines | length >= 5
      retries: 40
      delay: 10
      changed_when: false

    - name: Display registered nodes
      ansible.builtin.debug:
        msg: "Registered nodes: {{ registered_nodes.stdout_lines }}"

    - name: Wait for all nodes to be Ready
      ansible.builtin.command: kubectl get nodes
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: nodes_status
      until: "'NotReady' not in nodes_status.stdout"
      retries: 40
      delay: 10
      changed_when: false

    - name: Verify all Calico pods are running
      ansible.builtin.shell: |
        kubectl get pods -n kube-system -l k8s-app=calico-node -o wide | tail -n +2 | awk '{print $3}' | grep -v Running || true
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: calico_pods_status
      until: calico_pods_status.stdout == ""
      retries: 30
      delay: 10
      changed_when: false

    - name: Verify CoreDNS pods are running
      ansible.builtin.shell: |
        kubectl get pods -n kube-system -l k8s-app=kube-dns -o jsonpath='{.items[*].status.phase}' | grep -v Running || echo "All Running"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: coredns_status
      until: coredns_status.stdout == "All Running"
      retries: 20
      delay: 10
      changed_when: false

    - name: Display nodes status
      ansible.builtin.debug:
        msg: "{{ nodes_status.stdout_lines }}"

    - name: Label web worker nodes
      ansible.builtin.command: >
        kubectl label nodes {{ item }} workload=web --overwrite
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      loop:
        - onprem-k8s-web-01
        - onprem-k8s-web-02
      register: web_label_result
      failed_when: false

    - name: Display web node labeling results
      ansible.builtin.debug:
        msg: "Web node {{ item.item }}: {{ 'labeled' if item.rc == 0 else 'failed - ' + item.stderr }}"
      loop: "{{ web_label_result.results }}"
      when: web_label_result is defined

    - name: Label celery worker nodes
      ansible.builtin.command: >
        kubectl label nodes {{ item }} workload=worker --overwrite
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      loop:
        - onprem-k8s-worker-01
        - onprem-k8s-worker-02
      register: worker_label_result
      failed_when: false

    - name: Display worker node labeling results
      ansible.builtin.debug:
        msg: "Worker node {{ item.item }}: {{ 'labeled' if item.rc == 0 else 'failed - ' + item.stderr }}"
      loop: "{{ worker_label_result.results }}"
      when: worker_label_result is defined

- name: Kubernetes Cluster Health Validation
  hosts: k8s_control_plane
  become: false
  gather_facts: false
  vars_files:
    - "../group_vars/onprem/nautobot.yml"

  tasks:
    - name: Get cluster component status
      ansible.builtin.command: kubectl get componentstatuses
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: component_status
      changed_when: false
      failed_when: false

    - name: Get all nodes with detailed status
      ansible.builtin.command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: all_nodes_status
      changed_when: false

    - name: Get control plane pods status
      ansible.builtin.command: kubectl get pods -n kube-system -o wide
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: control_plane_pods
      changed_when: false

    - name: Get Calico network pods status
      ansible.builtin.command: kubectl get pods -n kube-system -l k8s-app=calico-node -o wide
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: calico_pods
      changed_when: false

    - name: Verify pod network connectivity with a test pod
      ansible.builtin.shell: |
        kubectl run busybox-test --image=busybox:1.28 --restart=Never --rm -i --command -- nslookup kubernetes.default 2>&1 || echo "DNS test completed"
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: network_test
      changed_when: false
      timeout: 30
      failed_when: false

    - name: Display cluster health summary
      ansible.builtin.debug:
        msg:
          - "╔══════════════════════════════════════════════════════════════╗"
          - "║          🏥 KUBERNETES CLUSTER HEALTH CHECK 🏥              ║"
          - "╚══════════════════════════════════════════════════════════════╝"
          - ""
          - "📊 Cluster Nodes:"
          - "{{ all_nodes_status.stdout_lines }}"
          - ""
          - "🔧 Control Plane Pods:"
          - "{{ control_plane_pods.stdout_lines }}"
          - ""
          - "🌐 Network Pods (Calico):"
          - "{{ calico_pods.stdout_lines }}"
          - ""
          - "✅ Cluster is healthy and ready for application deployment!"

- name: Install Helm on master node
  hosts: k8s_control_plane
  become: true
  gather_facts: true
  vars_files:
    - "../group_vars/onprem/nautobot.yml"

  tasks:
    - name: Check if Helm is installed
      ansible.builtin.command: helm version
      register: helm_check
      failed_when: false
      changed_when: false

    - name: Download Helm installation script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get_helm.sh
        mode: '0700'
      when: helm_check.rc != 0

    - name: Install Helm
      ansible.builtin.command: /tmp/get_helm.sh
      when: helm_check.rc != 0

    - name: Verify Helm installation
      ansible.builtin.command: helm version
      become_user: "{{ ansible_user }}"
      changed_when: false

- name: Install Nginx Ingress Controller (Load Balancer)
  hosts: k8s_control_plane
  become: false
  gather_facts: false
  vars_files:
    - "../group_vars/onprem/nautobot.yml"

  tasks:
    - name: Add Nginx Ingress Helm repository
      ansible.builtin.command: >
        helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
      changed_when: false

    - name: Update Helm repositories
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: Check if Nginx Ingress is installed
      ansible.builtin.command: helm list -n ingress-nginx
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: ingress_installed
      changed_when: false
      failed_when: false

    - name: Verify cluster has at least 5 nodes before installing Ingress
      ansible.builtin.command: kubectl get nodes --no-headers
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: cluster_nodes
      failed_when: cluster_nodes.stdout_lines | length < 5
      changed_when: false

    - name: Display cluster nodes count
      ansible.builtin.debug:
        msg: "Cluster has {{ cluster_nodes.stdout_lines | length }} nodes ready for Ingress installation"

    - name: Install Nginx Ingress Controller
      ansible.builtin.command: >
        helm install ingress-nginx ingress-nginx/ingress-nginx
        --namespace ingress-nginx
        --create-namespace
        --set controller.service.type=NodePort
        --set controller.service.nodePorts.http=30080
        --set controller.service.nodePorts.https=30443
        --set controller.hostNetwork=true
        --set controller.kind=DaemonSet
        --set controller.nodeSelector."node-role\.kubernetes\.io/control-plane"=""
        --set controller.tolerations[0].key=node-role.kubernetes.io/control-plane
        --set controller.tolerations[0].effect=NoSchedule
        --timeout=10m
        --wait
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      when: "'ingress-nginx' not in ingress_installed.stdout"
      register: ingress_install_result
      failed_when: false

    - name: Display Ingress installation result
      ansible.builtin.debug:
        msg: "{{ ingress_install_result.stdout_lines if ingress_install_result.stdout_lines is defined else 'Already installed' }}"

    - name: Check Ingress Controller pods if installation seemed to fail
      ansible.builtin.command: kubectl get pods -n ingress-nginx
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: ingress_pods
      changed_when: false
      when: ingress_install_result is defined and ingress_install_result.rc != 0

    - name: Display Ingress pods status
      ansible.builtin.debug:
        msg: "{{ ingress_pods.stdout_lines }}"
      when: ingress_pods is defined and ingress_pods.stdout_lines is defined

    - name: Wait for Ingress Controller pods to be ready
      ansible.builtin.command: >
        kubectl wait --namespace ingress-nginx
        --for=condition=ready pod
        --selector=app.kubernetes.io/component=controller
        --timeout=300s
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      register: ingress_wait_result
      failed_when: false
      changed_when: false

    - name: Display Ingress readiness status
      ansible.builtin.debug:
        msg: "Ingress Controller {{ 'is ready' if ingress_wait_result.rc == 0 else 'may not be fully ready - check pods status' }}"

- name: Deploy PostgreSQL and Redis on VMs
  hosts: postgres,redis
  become: true
  gather_facts: true
  vars_files:
    - "../group_vars/all/nautobot.yml"
    - "../group_vars/onprem/nautobot.yml"
    - "../group_vars/onprem/vault.yml"

  tasks:
    - name: Deploy PostgreSQL
      include_role:
        name: vm_postgres
      when: "'postgres' in group_names"
      tags: [postgres]

    - name: Deploy Redis
      include_role:
        name: vm_redis
      when: "'redis' in group_names"
      tags: [redis]

- name: Deploy Nautobot using Helm
  hosts: k8s_control_plane
  become: false
  gather_facts: true
  vars_files:
    - "../group_vars/onprem/nautobot.yml"
    - "../group_vars/onprem/vault.yml"

  tasks:
    - name: Create Helm charts directory
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/nautobot-helm"
        state: directory
        mode: '0755'

    - name: Copy Helm chart to master
      ansible.builtin.copy:
        src: "../helm/nautobot/"
        dest: "/home/{{ ansible_user }}/nautobot-helm/"
        mode: '0644'

    - name: Create nautobot namespace
      ansible.builtin.command: kubectl create namespace nautobot
      register: namespace_created
      failed_when: false
      changed_when: "'created' in namespace_created.stdout"

    - name: Create Nautobot secrets
      ansible.builtin.shell: |
        kubectl create secret generic nautobot-secrets \
          --namespace=nautobot \
          --from-literal=db-password='{{ vault_database_password }}' \
          --from-literal=db-user='{{ vault_database_user }}' \
          --from-literal=secret-key='{{ vault_nautobot_secret_key }}' \
          --from-literal=superuser-password='{{ vault_nautobot_superuser_password }}' \
          --from-literal=redis-password='{{ vault_redis_password }}' \
          --dry-run=client -o yaml | kubectl apply -f -
      no_log: true

    - name: Deploy Nautobot with Helm
      ansible.builtin.command: >
        helm upgrade --install nautobot /home/{{ ansible_user }}/nautobot-helm
        --namespace nautobot
        --set image.tag={{ nautobot_version }}
        --set database.host={{ nautobot_db.host }}
        --set database.port={{ nautobot_db.port }}
        --set database.name={{ vault_database_name }}
        --set redis.host={{ nautobot_redis.host }}
        --set redis.port={{ nautobot_redis.port }}
        --set ingress.enabled=true
        --set ingress.host={{ ansible_host }}
        --set web.replicas=2
        --set worker.replicas=2
        --set scheduler.replicas=1
        --wait
        --timeout=10m
      register: helm_deploy

    - name: Wait for Nautobot pods to be ready
      ansible.builtin.command: >
        kubectl wait --namespace nautobot
        --for=condition=ready pod
        --selector=app.kubernetes.io/name=nautobot
        --timeout=600s
      changed_when: false

    - name: Get all pods status
      ansible.builtin.command: kubectl get pods -n nautobot -o wide
      register: pods_status
      changed_when: false

    - name: Get services
      ansible.builtin.command: kubectl get svc -n nautobot
      register: services
      changed_when: false

    - name: Get ingress
      ansible.builtin.command: kubectl get ingress -n nautobot
      register: ingress
      changed_when: false

