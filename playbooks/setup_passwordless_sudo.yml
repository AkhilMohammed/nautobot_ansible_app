---
- name: Setup passwordless sudo
  hosts: all
  gather_facts: false
  tasks:
    - name: Configure passwordless sudo for ubuntu user
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/ubuntu-nopasswd
        line: 'ubuntu ALL=(ALL) NOPASSWD:ALL'
        create: yes
        mode: '0440'
        validate: 'visudo -cf %s'
      become: yes
