---
# Playbook to Setup GitLab Runner on On-Premises VM
# Usage: ansible-playbook -i inventory/vm/onprem.yml playbooks/setup_gitlab_runner.yml --ask-vault-pass

- name: Install and Configure GitLab Runner
  hosts: gitlab_runner
  become: true
  become_method: sudo
  gather_facts: true
  vars_files:
    - "../group_vars/onprem/nautobot.yml"
    - "../group_vars/onprem/vault.yml"

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - python3
          - python3-pip
          - ansible
        state: present
        update_cache: yes

    - name: Add GitLab Runner repository
      ansible.builtin.shell: |
        curl -L "https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh" | bash
      args:
        creates: /etc/apt/sources.list.d/runner_gitlab-runner.list

    - name: Install GitLab Runner
      ansible.builtin.apt:
        name: gitlab-runner
        state: present
        update_cache: yes

    - name: Register GitLab Runner
      ansible.builtin.command: >
        gitlab-runner register
        --non-interactive
        --url "{{ gitlab_url }}"
        --registration-token "{{ vault_gitlab_runner_token }}"
        --executor "shell"
        --description "On-Prem Nautobot Runner"
        --tag-list "onprem,ansible,nautobot"
      args:
        creates: /etc/gitlab-runner/config.toml
      when: vault_gitlab_runner_token is defined

    - name: Ensure GitLab Runner service is running
      ansible.builtin.systemd:
        name: gitlab-runner
        state: started
        enabled: true

    - name: Add gitlab-runner user to sudo group
      ansible.builtin.user:
        name: gitlab-runner
        groups: sudo
        append: yes

    - name: Configure passwordless sudo for gitlab-runner
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/gitlab-runner
        line: 'gitlab-runner ALL=(ALL) NOPASSWD: ALL'
        create: yes
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Display runner status
      ansible.builtin.debug:
        msg:
          - "✅ GitLab Runner installed and configured"
          - "Runner is ready to execute CI/CD pipelines"
          - "Tags: onprem, ansible, nautobot"
