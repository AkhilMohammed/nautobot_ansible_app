---
- name: Deploy Nautobot full stack on VMs
  hosts: all
  become: true
  become_method: sudo
  gather_facts: true

  vars:
    # Allow overriding env from CLI: -e deploy_env=dev
    # deploy_env is expected to be passed from command line or defaults to 'dev'
    env_name: "{{ deploy_env | default('dev') }}"

  vars_files:
    - "../group_vars/all/nautobot.yml"
    - "../group_vars/{{ env_name }}/nautobot.yml"
    - "../group_vars/{{ env_name }}/vault.yml"

  pre_tasks:
    - name: Show deployment context
      ansible.builtin.debug:
        msg:
          - "Deploying Nautobot {{ nautobot_version }} to {{ inventory_hostname }}"
          - "Environment: {{ deploy_env }}"
          - "Deployment type: {{ deployment_type | default('vm') }}"

  roles:
    - role: vm_postgres
      tags: [postgres, infra]

    - role: vm_redis
      tags: [redis, infra]

    - role: vm_nautobot_app
      tags: [nautobot, app]

    - role: vm_nautobot_worker
      tags: [nautobot, worker]

    - role: vm_nautobot_scheduler
      tags: [nautobot, scheduler]

  post_tasks:
    - name: Ensure Nautobot services are running
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: "{{ nautobot_services }}"
      tags: [verify]

    - name: Wait for nginx HTTPS port
      ansible.builtin.wait_for:
        port: 443
        host: "{{ ansible_host }}"
        timeout: 30
      tags: [verify]

    - name: Test HTTP → HTTPS redirect
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}/"
        method: GET
        status_code: 200
        validate_certs: no
      register: http_redirect
      tags: [verify]

    - name: Check Nautobot HTTPS API (ignore SSL + accept login redirect)
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}/"
        method: GET
        status_code: [200, 302]
        validate_certs: no
        follow_redirects: false  # ← FIXED deprecation
      register: api_check
      retries: 10
      delay: 6
      until: api_check.status in [200, 302]
      tags: [verify]

    - name: Ensure Nautobot admin user exists
      ansible.builtin.command:
        cmd: >-
          {{ nautobot_venv }}/bin/nautobot-server shell -c
          "from django.contrib.auth import get_user_model; User=get_user_model();
          user, _ = User.objects.get_or_create(username='{{ nautobot_admin_username | default('admin') }}',
          defaults={'email': '{{ nautobot_admin_email | default('admin@example.com') }}'});
          user.email='{{ nautobot_admin_email | default('admin@example.com') }}';
          user.is_staff=True; user.is_superuser=True; user.is_active=True;
          user.set_password('{{ nautobot_admin_password | default('admin') }}'); user.save()"
      environment:
        NAUTOBOT_CONFIG: "{{ nautobot_config_path }}"
      become: true
      become_user: "{{ nautobot_user | default('nautobot') }}"
      no_log: true
      when: "'nautobot_web' in group_names"
      tags: [verify]

    - name: Show deployment result
      ansible.builtin.debug:
        msg:
          - "✅ Nautobot deployment successful on {{ inventory_hostname }}"
          - "✅ HTTP redirect status: {{ http_redirect.status }}"
          - "✅ HTTPS status: {{ api_check.status }}"
          - "🌐 Access: https://{{ ansible_host }}/ (accept cert warning)"
          - "🔐 Superuser: {{ nautobot_admin_username | default('admin') }}"
      when: api_check.status in [200, 302]
